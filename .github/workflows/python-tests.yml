name: Python tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q skills/autopilot/tools tests
      - name: Dashboard JavaScript syntax (Node.js)
        run: python tools/check-dashboard.py
      - name: Browser dashboard smoke
        if: runner.os == 'Linux'
        env:
          AUTOPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/autopilot-dashboard
        run: python tools/check-dashboard-browser.py
      - name: Upload dashboard screenshots
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-3-visual-smoke
          path: ${{ runner.temp }}/autopilot-dashboard/*.png
          if-no-files-found: error
      - name: Unit tests
        run: python -m unittest discover -s tests -v
