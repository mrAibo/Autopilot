function render(lang){
  const L = I18N[lang] || I18N.ru;
  CUR = L;
  const S = STATE, T = S.tickets || [], R = S.requirements || {};
  MARKS = collectMarks(S);
  WAITS = collectWaits(S);
  const fin = !!S.finishedAt;
  const waiting = !fin && S.waiting ? S.waiting : null;

  const by = st => T.filter(t => t.status === st);
  const done = by('done'), writing = by('in-progress'), inReview = by('review'),
        inRepair = by('repair'), failedT = by('failed');
  const running = writing.concat(inReview, inRepair);
  const pending = T.length - done.length - running.length - failedT.length;
  const live = Math.max(0, (R.total || 0) - (R.dropped || 0));

  const mins = t => (t.startedAt && t.finishedAt)
    ? Math.max(1, Math.round(activeMs(t.startedAt, t.finishedAt) / 60000)) : null;
  const durations = done.map(mins).filter(Boolean).sort((a,b) => a-b);
  const median = durations.length ? durations[Math.floor(durations.length/2)] : null;

  // Этапы: канонический порядок, поверх него — то, что прислал state.js.
  const given = Array.isArray(S.stages) ? S.stages.filter(Boolean) : [];
  const stages = STAGE_IDS.map(id => given.find(s => s.id === id) || {id, status:'pending'});
  const stName = s => L.stages[s.id] || s.id;
  const activeStage = stages.find(s => s.status === 'active');
  const failedStage = stages.find(s => s.status === 'failed');
  const t0 = String(S.tier).toUpperCase() === 'T0';
  const stage = id => stages.find(s => s.id === id) || {};

  // ——— сколько осталось ———
  // По цепочке тасков в минутах, а не «медиана × длина цепочки»: иначе таск,
  // который идёт двадцать седьмую минуту, стоит в оценке как не начатый.
  // Плюс то, что идёт после разработки: ревью всей ветки и приёмка —
  // на реальных прогонах это почти половина времени, и без них оценка врала.
  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  const leftFor = t => {
    if (!t || t.status === 'done') return 0;
    const full = median || 10;
    if (t.status === 'review') return full * 0.2;
    if (t.status === 'repair') return full * 0.5;
    if (t.status === 'in-progress' && t.startedAt)
      return Math.max(1, full - (activeMs(t.startedAt, null) || 0) / 60000);
    return full;
  };
  const memo = {};
  function chainMin(id, seen){
    const t = byId[id];
    if (!t || t.status === 'done') return 0;
    if (memo[id] != null) return memo[id];
    if (seen.has(id)) return leftFor(t);
    seen.add(id);
    const d = leftFor(t) + Math.max(0, ...(t.blockedBy || []).map(b => chainMin(b, seen)));
    seen.delete(id);
    return memo[id] = d;
  }
  const cpMin = Math.max(0, ...T.map(t => chainMin(t.id, new Set())));
  const stageMin = id => { const s = stage(id); return s.startedAt ? (activeMs(s.startedAt, s.finishedAt) || 0) / 60000 : 0; };
  let left = null, lateEta = false;
  if (!fin && !waiting && !failedStage) {
    const buildSoFar = stageMin('build');
    if (activeStage && activeStage.id === 'build' && median) {
      left = cpMin + Math.max(10, 0.5 * (buildSoFar + cpMin)) + 8;
    } else if (activeStage && activeStage.id === 'review') {
      left = Math.max(5, 0.6 * buildSoFar - stageMin('review')) + 8; lateEta = true;
    } else if (activeStage && activeStage.id === 'final') {
      left = Math.max(3, 10 - stageMin('final')); lateEta = true;
    }
  }
  const eta = left ? [Math.max(1, Math.round(left * 0.75)), Math.max(2, Math.round(left * 1.4))] : null;
  const etaText = eta ? (eta[1] < 60 ? `${eta[0]}–${eta[1]}<small>${L.min}</small>`
    : `${fmtDur(eta[0])} — ${fmtDur(eta[1])}`) : '';

  // ——— шапка ———
  const names = list => list.map(t => q(esc(t.title), L.lang)).join(', ');
  const idsOf = list => list.map(t => esc(t.id)).join(', '); // «Обзор»: название таска видно один раз, в Ганте
  let heroCls = '', stateLine, h2, lead = '', ovLead = null, big = '', bigSub = '', hint = '';
  if (fin) {
    heroCls = 'won';
    const k = (S.debt?.emptyEnv || []).length, p = (S.debt?.placeholders || []).length;
    stateLine = `<span class="badge-ic">${ic('check','xs')}</span>${L.doneState}`;
    h2 = esc(S.result || L.doneDefault);
    lead = k || p ? L.doneNeed(k, p) : L.doneNothing;
    big = fmtClock(activeMs(S.startedAt, S.finishedAt));
    bigSub = L.doneBig(hhmm(S.finishedAt));
  } else if (waiting) {
    heroCls = 'ask';
    stateLine = `<span class="live" aria-hidden="true"></span>${L.waitState}`;
    h2 = L.waitH2[waiting.kind] || L.waitState;
    lead = waiting.note ? esc(waiting.note) : '';
    hint = `<span class="hint">${ic('msg','m')}${L.waitHint}</span>`;
    big = `<span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span>`;
    bigSub = L.waitBig;
  } else if (failedStage) {
    heroCls = 'bad';
    stateLine = `<span class="badge-ic">${ic('x','xs')}</span>${L.failState}`;
    h2 = L.failH2(stName(failedStage));
    lead = esc(failedStage.note || '');
  } else {
    const cur = activeStage || stages.find(s => s.status === 'pending') || stages[stages.length - 1];
    stateLine = `<span class="live" aria-hidden="true"></span>${L.stateRun[cur.id] || stName(cur)}`;
    if (cur.id === 'build' && T.length) {
      h2 = done.length === T.length ? L.buildAllDone(T.length) : L.buildH2(done.length, T.length, running.length);
      const leadOf = nm => [writing.length ? L.leadWriting(nm(writing)) : '', inReview.length ? L.leadReview(nm(inReview)) : '',
        inRepair.length ? L.leadRepair(nm(inRepair)) : '', failedT.length ? L.leadFailed(nm(failedT)) : '']
        .filter(Boolean).join(' ') || (done.length < T.length ? L.leadIdle : '');
      lead = leadOf(names); ovLead = leadOf(idsOf);
    } else {
      h2 = L.h2Run[cur.id] || stName(cur);
      lead = cur.note ? esc(cur.note) : (L.leadRun[cur.id] || '');
    }
    if (eta) { big = etaText; bigSub = lateEta ? L.etaLate : L.etaLbl; }
    else if (cur.startedAt) { big = timerHTML(cur.startedAt, null); bigSub = L.stageClock(stName(cur)); }
  }
  // Шкала этапов: пройденное залито, текущее — в полоску, пропущенное — штриховкой.
  const segs = stages.map(s => {
    const st = s.status;
    let cls = 's-pend', fill = '0%', inner = '', time = L.ahead;
    if (st === 'done') { cls = 's-done'; fill = '100%'; time = s.startedAt ? timerHTML(s.startedAt, s.finishedAt) : '—'; }
    else if (st === 'skipped') { cls = 's-skip'; time = L.skipped; }
    else if (st === 'failed') { cls = 's-fail'; fill = '100%'; time = L.failedSt; }
    else if (st === 'active') {
      cls = 's-now'; inner = 'stripes';
      fill = s.id === 'build' && T.length ? Math.max(8, Math.round(done.length / T.length * 100)) + '%' : '50%';
      time = waiting ? L.waitingSt : (s.startedAt ? timerHTML(s.startedAt, null) : '—');
    }
    return `<div class="${cls}"><div class="seg"><i class="${inner}" style="width:${fill}"></i></div>
      <span class="s-name">${esc(stName(s))}</span><span class="s-time">${time}</span></div>`;
  }).join('');
  const hero = `<section class="hero ${heroCls} w" aria-live="polite">
    <div class="hero-top">
      <div class="hero-main"><div class="state">${stateLine}</div><h2>${h2}</h2>
        ${lead ? `<p class="lead">${lead}</p>` : ''}${hint}</div>
      ${big ? `<div class="big"><b>${big}</b><span>${bigSub}</span>
        <span class="paused" data-idle-note hidden>${L.paused}</span></div>` : ''}
    </div>
    <div class="track" role="list">${segs}</div>
  </section>`;

  // ——— плитки ———
  const reqList = S.reqList || [];
  const rk = {done:R.done||0, work:(R.inTicket||0)+(R.inSpec||0), ph:R.placeholder||0, def:R.deferred||0, drop:R.dropped||0};
  rk.open = Math.max(0, (R.total||0) - rk.done - rk.work - rk.ph - rk.def - rk.drop);
  const reqStack = `<div class="stack" aria-hidden="true">${[[rk.done,'f-done'],[rk.ph,'f-now'],[rk.work + rk.open,'f-idle'],[rk.def,'f-q']]
    .filter(x => x[0]).map(([n, c]) => `<i class="${c}" style="flex:${n}"></i>`).join('')}</div>`;
  const reqPartsText = [L.reqParts.done, rk.work ? L.reqParts.work(rk.work) : '', rk.open ? L.reqParts.open(rk.open) : '', rk.ph ? L.reqParts.ph(rk.ph) : '',
    rk.def ? L.reqParts.def(rk.def) : '', rk.drop ? L.reqParts.drop(rk.drop) : ''].filter(Boolean).join(' · ');
  const tileReq = `<section class="card tile w"><span class="tk">${L.tReqs}</span>${R.total
    ? `<span class="tv">${rk.done}<small>${L.of} ${live}</small></span>${reqStack}
       <span class="ts">${reqPartsText}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.reqLater}</span>`}</section>`;
  const retries = T.reduce((s,t) => s + (t.retries||0), 0), repairs = T.reduce((s,t) => s + (t.repairs||0), 0);
  const tileTk = `<section class="card tile w"><span class="tk">${L.tTickets}</span>${T.length
    ? `<span class="tv">${done.length}<small>${L.of} ${T.length}</small></span>
       <div class="sq" aria-hidden="true">${T.map(t => `<i class="${kindOf(t).bar}"></i>`).join('')}</div>
       <span class="ts">${(done.length === T.length
         ? [L.tkParts.all, repairs ? L.tkParts.repair(repairs) : '', retries ? L.tkParts.retry(retries) : '']
         : [writing.length ? L.tkParts.now(writing.length) : '', inReview.length ? L.tkParts.rev(inReview.length) : '',
            inRepair.length ? L.tkParts.fix(inRepair.length) : '', failedT.length ? L.tkParts.bad(failedT.length) : ''])
         .filter(Boolean).join(' · ') || L.leadIdle}</span>`
    : `<span class="tv dim">${t0 ? `<span style="font-size:.6em">${L.noSplit}</span>` : '—'}</span><span class="ts">${t0 ? '' : L.tkLater}</span>`}</section>`;
  const last = done[done.length - 1];
  const tests = S.tests || (last && last.tests) || null;
  const tileTests = `<section class="card tile w"><span class="tk">${L.tTests}</span>${tests
    ? `<span class="tv">${esc(tests.passed)}</span><span class="okb ${tests.failed ? 'f-bad' : 'f-done'}">${ic(tests.failed ? 'x' : 'check','xs')}${
        tests.failed ? esc(L.testsBad(tests.failed)) : L.testsOk}</span><span class="ts">${fin ? L.testsFinal : L.testsSub}</span>`
    : `<span class="tv dim">—</span><span class="ts">${L.testsLater}</span>`}</section>`;
  const B = S.blind;
  const tileTime = `<section class="card tile w"><span class="tk">${L.tTime}</span><span class="tv">${S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '—'}</span>
        <span class="ts">${L.timeSub}${median ? ' · ' + L.median(median) : ''}</span></section>`;
  const tile4 = fin && B
    ? `<section class="card tile w"><span class="tk">${L.tBlind}</span><span class="tv">${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></span>
        <div class="stack" aria-hidden="true"><i class="f-done" style="flex:${+B.matched||0}"></i><i class="f-now" style="flex:${Math.max(0,(+B.checked||0)-(+B.matched||0))}"></i></div>
        <span class="ts">${L.blindSub((B.mismatches||[]).length)}</span></section>`
    : tileTime;

  // ——— ход сборки ———
  // Полоса показывает СОСТОЯНИЕ, а не долю: горизонтальная заливка в списке
  // задач читается как прогресс всегда. Длительность — цифрой справа.
  const taskTime = t => t.status === 'done' ? fmtDur(mins(t)) : (t.startedAt && t.status !== 'pending') ? timerHTML(t.startedAt, t.finishedAt) : '—';
  // Заметка по таску: [класс, текст] или null; «Классика» и строки Ганта берут её отсюда.
  const noteOf = t => {
    const why = String(t.review || '').replace(/^(да|yes)\s*[—–-]\s*/i, '');
    return t.status === 'repair' && (t.repairFindings || []).length ? ['fix', L.noteRepair(t.repairFindings[t.repairFindings.length - 1])]
      : t.status === 'review' && /^(да|yes)/i.test(t.review || '') && why ? ['rev', L.noteReview(why)]
      : t.status === 'failed' && (t.concerns || []).length ? ['bad', t.concerns.join('; ')] : null;
  };
  const redoOf = t => [t.repairs ? L.tkParts.repair(t.repairs) : '', t.retries ? L.tkParts.retry(t.retries) : ''].filter(Boolean).join(' · ');
  const taskRow = t => {
    const k = kindOf(t);
    const time = taskTime(t);
    const note = noteOf(t);
    const extra = t.status === 'done' && redoOf(t) ? ' · ' + redoOf(t) : '';
    return `<div class="tl"><span class="tl-id${k.on ? ' on' : ''}">${esc(t.id)}</span>
      <div class="bar ${k.bar}" title="${esc(t.title)}"><span class="nm">${esc(t.title)}</span>
        <span class="chipin">${ic(k.icon,'xs')}<span class="lbl">${L.chip[k.k]}${extra}</span></span></div>
      <span class="tl-time ${k.on ? k.k : ''}">${time}</span>
      ${note ? `<div class="tl-note ${note[0]}">${ic(KIND[t.status].icon)}<span>${esc(note[1])}</span></div>` : ''}</div>`;
  };
  let buildCard = '';
  if (T.length) {
    const counts = {};
    T.forEach(t => { const k = kindOf(t).k; counts[k] = (counts[k] || 0) + 1; });
    const legend = ['done','now','rev','fix','bad','wait'].filter(k => counts[k]).map(k =>
      `<span class="lg"><i class="${{done:'f-done',now:'f-now',rev:'f-rev',fix:'f-fix',bad:'f-bad',wait:'f-wait'}[k]}"></i>${L.kinds[k]} <b>${counts[k]}</b></span>`).join('');
    const waves = [...new Set(T.map(t => t.wave ?? 1))].sort((a,b) => a-b);
    const rows = waves.map(w => {
      const inWave = T.filter(t => (t.wave ?? 1) === w)
        .sort((a,b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
      const blockers = [...new Set(inWave.flatMap(t => t.blockedBy || []))].filter(b => byId[b] && byId[b].status !== 'done');
      const sub = inWave.every(t => t.status === 'pending') && blockers.length ? L.waveWaits(blockers)
        : inWave.length > 1 ? L.waveSub(inWave.length) : '';
      return `<div class="wave">${esc(L.wave(w))}${sub ? ` <span>${esc(sub)}</span>` : ''}</div>` + inWave.map(taskRow).join('');
    }).join('');
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3><div class="legend">${legend}</div></div>${rows}</section>`;
  } else if (t0 && (activeStage?.id === 'build' || stage('build').status === 'done')) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.t0}</span></div></section>`;
  } else if (!fin) {
    buildCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.build}</h3></div><div class="empty">${ic('list','m')}<span>${L.noTickets}</span></div></section>`;
  }

  // ——— списки ———
  const list = (key, arr, n, fmt) => {
    if (!arr || !arr.length) return '';
    const open = UI.open[key], shown = open ? arr : arr.slice(0, n);
    return `<ul class="nl n0">${shown.map(x => `<li>${fmt ? fmt(x) : esc(x)}</li>`).join('')}</ul>` + (arr.length > n
      ? `<button type="button" class="btn-soft" data-more="${key}">${open ? L.collapse + ic('up') : L.more(arr.length - n) + ic('chev')}</button>` : '');
  };
  // «файл:строка — суть» → адрес моноширинным, суть обычным текстом.
  const located = x => { const m = /^(\S+?(?::\d+[\w,-]*|\.\w+))\s+[—–-]\s+(.*)$/.exec(x); return m ? `<span class="mono" style="font-size:.9em;color:var(--mut)">${esc(m[1])}</span> — ${esc(m[2])}` : esc(x); };
  const env = S.debt?.emptyEnv || [], ph = S.debt?.placeholders || [], asm = S.debt?.assumptions || [];
  const keysBlock = env.length ? `<div class="need"><div class="nh">${L.envKeys}<span>${env.length}</span></div>
      <div class="keys">${env.map(k => `<code class="key">${esc(k)}</code>`).join('')}</div></div>` : '';
  const phBlock = ph.length ? `<div class="need"><div class="nh">${L.placeholders}<span>${ph.length}</span></div>${list('ph', ph, 3, located)}</div>` : '';
  const asmBlock = asm.length ? `<div class="need"><div class="nh">${L.assumptions}<span>${asm.length}</span></div>${list('asm', asm, 3)}</div>` : '';
  const needCard = fin
    ? (env.length || ph.length ? `<section class="card prep w"><div class="whead"><h3 class="wt"><i>${ic('flag')}</i>${L.prep}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section>` : '')
    : `<section class="card w"><div class="whead"><h3 class="wt">${L.need}</h3></div>${keysBlock + phBlock + asmBlock
        || `<p class="muted">${L.needEmpty}</p>`}</section>`;
  const asmCard = fin && asm.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.assumptions}</h3><span>${asm.length}</span></div>${list('asm', asm, 3)}</section>` : '';
  const report = S.report || [], concerns = S.concerns || [], additions = S.additions || [];
  const reportCard = report.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.report}</h3><span>${report.length}</span></div>${list('report', report, 3)}</section>` : '';
  const concernsCard = concerns.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.concerns}</h3><span>${concerns.length}</span></div>
      <p class="muted" style="margin-bottom:8px">${L.concernsNote}</p>${list('concerns', concerns, 3, located)}</section>` : '';
  const addCard = additions.length ? `<section class="card w"><div class="whead"><h3 class="wt">${L.additions}</h3><span>${additions.length}</span></div>${list('add', additions, 3)}</section>` : '';

  const blindCard = B ? `<section class="card w"><div class="whead"><h3 class="wt">${L.blind}</h3></div>
      <div class="blind-top"><b>${esc(B.matched)}<small>${L.of} ${esc(B.checked)}</small></b><p>${L.blindNote} ${(B.mismatches||[]).length ? L.blindBad : L.blindOk}</p></div>
      ${(B.mismatches||[]).map(m => { const x = /^([RGA]\d+\w*)\s+[—–-]\s+(.*)$/.exec(m);
        return `<div class="req"><p>${x ? `<span class="rid">${esc(x[1])}</span>${esc(x[2])}` : esc(m)}</p></div>`; }).join('')}</section>` : '';

  // ——— твои слова ———
  let wordsCard = '';
  if (reqList.length) {
    const rows = reqList.map((r, i) => ({...r, k: REQ_KIND[r.status] || 'open', i}))
      .sort((a, b) => ((REQ_RANK[a.k] ?? 9) - (REQ_RANK[b.k] ?? 9)) || a.i - b.i);
    const cnt = {}; rows.forEach(r => { cnt[r.k] = (cnt[r.k] || 0) + 1; });
    const F = [['all', L.fAll, rows.length, ''], ['done', L.fDone, cnt.done, 'f-done'], ['work', L.fWork, cnt.work, 'f-idle'],
      ['open', L.fOpen, cnt.open, 'f-idle'], ['placeholder', L.fPh, cnt.placeholder, 'f-now'],
      ['deferred', L.fDef, cnt.deferred, 'f-q'], ['dropped', L.fDrop, cnt.dropped, 'f-q']].filter(f => f[2]);
    if (!F.some(f => f[0] === UI.filter)) UI.filter = 'all';
    const picked = rows.filter(r => UI.filter === 'all' || r.k === UI.filter);
    const open = UI.open.words, shown = open ? picked : picked.slice(0, 6);
    wordsCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.words}</h3><span>${L.wordsSub(rows.length)}</span></div>
      ${F.length > 2 ? `<div class="chips" role="group">${F.map(([id, lbl, n, sw]) =>
        `<button type="button" class="chip" data-filter="${id}" aria-pressed="${UI.filter === id}">${sw ? `<i class="${sw}"></i>` : ''}${lbl} <span>${n}</span></button>`).join('')}</div>` : ''}
      ${shown.map(r => `<div class="req"><div style="min-width:0"><p><span class="rid">${esc(r.id)}</span>${esc(r.text)}</p>${
        r.why ? `<span class="why">${esc(r.why)}</span>` : ''}</div><span class="pill ${REQ_PILL[r.k]}">${L.rs[r.k]}</span></div>`).join('')}
      ${picked.length > 6 ? `<div class="more"><button type="button" class="btn-soft" data-more="words">${open ? L.collapse + ic('up') : L.showAll(picked.length) + ic('chev')}</button></div>` : ''}
    </section>`;
  }

  // ——— проверки ———
  const G = Object.assign({}, S.gates || {});
  if (!G.G2 && S.coverage) G.G2 = {ok: true, found: S.coverage.found, fixed: S.coverage.fixed, deferred: S.coverage.deferred};
  if (!G.G4 && B) G.G4 = {ok: !(B.mismatches || []).length, matched: B.matched, checked: B.checked};
  const gate = (id, cls, icon, sub) => `<div class="gate"><span class="gi ${cls}">${ic(icon,'xs')}</span><div><div class="gt">${L.gT[id]}</div><div class="gs">${sub}</div></div><span class="gk">${id}</span></div>`;
  const later = (id, sub) => gate(id, 'wait', 'clock', fin ? L.gNone : sub);
  const g1 = G.G1 ? (G.G1.ok ? gate('G1','ok','check',esc(L.g1ok(G.G1.total || R.total || 0))) : gate('G1','warn','alert',esc(L.g1bad(G.G1.open || 0))))
    : waiting && waiting.kind === 'briefing' ? gate('G1','warn','msg',L.g1ask) : later('G1', L.g1later);
  const g2 = G.G2 ? gate('G2', G.G2.ok ? 'ok' : 'warn', G.G2.ok ? 'check' : 'alert', L.g2(+G.G2.found||0, +G.G2.fixed||0, +G.G2.deferred||0)) : later('G2', L.g2later);
  const g3 = G.G3 ? (G.G3.ok ? gate('G3','ok','check',L.g3ok(live, T.length)) : gate('G3','bad','x',esc(L.g3bad(G.G3.problems || 0)))) : later('G3', L.g3later);
  const g4 = G.G4 ? gate('G4', G.G4.ok ? 'ok' : 'warn', G.G4.ok ? 'check' : 'alert',
      L.g4(esc(G.G4.matched), esc(G.G4.checked), Math.max(0, (+G.G4.checked||0) - (+G.G4.matched||0)))) : later('G4', L.g4later);
  const okGates = ['G1','G2','G3','G4'].filter(g => G[g] && G[g].ok).length;
  const gatesCard = `<section class="card w"><div class="whead"><h3 class="wt">${L.gates}</h3><span>${L.gatesOf(okGates)}</span></div>${g1}${g2}${g3}${g4}</section>`;

  // ——— лента ———
  const evText = e => {
    const V = L.ev;
    if (e.k === 'stage') return (V.stage[e.act] || V.stage.start)(L.stages[e.id] || e.id, e.note);
    if (e.k === 'ticket') return (V.ticket[e.act] || V.ticket.start)(e.ids || [], e.act === 'done' ? e.tests : e.note);
    if (e.k === 'gate') return (V.gate[e.g] || (() => e.g))(e.ok, e);
    if (e.k === 'add') return (V.add[e.key] || (n => `${e.key}: +${n}`))(e.n || 1);
    if (e.k === 'tickets') return V.tickets(e.n || 0);
    if (e.k === 'tests') return V.tests(e);
    if (e.k === 'ask') return V.ask(e);
    return typeof V[e.k] === 'string' ? V[e.k] : null;
  };
  const evTone = e => e.k === 'finish' ? ['f-done','flag'] : e.k === 'ask' ? ['f-now','msg'] : e.k === 'answered' ? ['','msg']
    : e.k === 'gate' ? (e.ok ? ['f-done','shield'] : ['f-now','alert'])
    : e.k === 'ticket' ? ({done:['f-done','check'], review:['f-rev','clock'], repair:['f-fix','rotate'], fail:['f-bad','x']}[e.act] || ['','play'])
    : e.k === 'stage' ? ({done:['f-done','check'], fail:['f-bad','x'], skip:['','chev']}[e.act] || ['','play'])
    : e.k === 'tests' ? [e.failed ? 'f-bad' : 'f-done', e.failed ? 'x' : 'check'] : e.k === 'add' ? ['','plus'] : ['','list'];
  const feedRow = e => {
    const text = evText(e);
    if (!text) return '';
    const [cls, icon] = evTone(e);
    return `<div class="ev"><span class="ei ${cls}">${ic(icon,'xs')}</span><span>${esc(text)}</span>${
      fin ? `<em>${hhmm(e.t)}</em>` : `<em data-ago-short="${esc(e.t)}">${agoShort(e.t)}</em>`}</div>`;
  };
  const feedEvents = (S.log || []).filter(e => e.k !== 'tier');
  const feedRows = feedEvents.slice(-12).reverse().map(feedRow).join('');
  const feedCard = feedRows ? `<section class="card w"><div class="whead"><h3 class="wt">${L.feed}</h3>${fin ? '' :
    `<span data-ago="${esc(S.updatedAt || '')}">${S.updatedAt ? agoText(S.updatedAt) : ''}</span>`}</div>${feedRows}</section>` : '';

  // ——— Mission control + provider/model transparency ———
  const langRu = L.lang === 'ru';
  const activeWorkers = T.filter(t => ['in-progress','review','repair'].includes(t.status));
  const failedWorkers = T.filter(t => t.status === 'failed');
  const readyWorkers = T.filter(t => t.status === 'pending' && (t.blockedBy || []).every(id => byId[id]?.status === 'done'));
  const nextTitle = waiting
    ? (langRu ? 'Нужен ваш ответ' : 'Your input is needed')
    : failedWorkers.length ? (langRu ? 'Есть заблокированные задачи' : 'Some tasks are blocked')
    : activeWorkers.length ? (langRu ? 'Сейчас идёт работа' : 'Work in progress')
    : fin ? (langRu ? 'Сборка завершена' : 'Build completed')
    : readyWorkers.length ? (langRu ? 'Следующая задача готова' : 'Next task is ready')
    : (langRu ? 'Подготовка следующего шага' : 'Preparing next step');
  const nextDetail = waiting
    ? (waiting.note || (langRu ? 'Для продолжения требуется решение пользователя.' : 'A decision is required to continue.'))
    : failedWorkers.length ? failedWorkers.map(t => t.id + ': ' + t.title).join(' · ')
    : activeWorkers.length ? activeWorkers.map(t => t.id + ': ' + t.title).join(' · ')
    : fin ? (S.result || (langRu ? 'Сводка и подтверждения ниже.' : 'See acceptance and checks below.'))
    : readyWorkers.length ? readyWorkers.slice(0,2).map(t => t.id + ': ' + t.title).join(' · ')
    : (langRu ? 'Проверьте этапы и требования ниже.' : 'Review stages and requirements below.');
  const completedCount = done.length;
  const percent = T.length ? Math.round(100 * completedCount / T.length) : null;
  const opsBlock = '<section class="ops" aria-label="' + (langRu ? 'Операционный центр' : 'Mission control') + '">'
    + '<div><div class="ops-eyebrow">' + (langRu ? 'ОПЕРАЦИОННЫЙ ЦЕНТР · СЛЕДУЮЩИЙ ШАГ' : 'MISSION CONTROL · NEXT ACTION')
    + '</div><div class="ops-head">' + esc(nextTitle)
    + '</div><div class="ops-detail">' + esc(nextDetail)
    + '</div></div><div class="ops-meta">'
    + '<div class="ops-metric"><b>' + (percent === null ? '—' : String(percent) + '%')
    + '</b><span>' + (langRu ? 'готовность задач' : 'tasks complete') + '</span></div>'
    + '<div class="ops-metric"><b>' + activeWorkers.length
    + '</b><span>' + (langRu ? 'активных' : 'active') + '</span></div>'
    + '<div class="ops-metric"><b>' + okGates + '/4</b><span>'
    + (langRu ? 'проверок пройдено' : 'quality gates passed') + '</span></div>'
    + '</div></section>';
  const routed = T.filter(t => t.routing && t.routing.model);
  const resourceItems = routed.map(t => {
    const info = t.routing;
    return '<div class="resource-item"><div class="resource-title">' + esc(t.id + ' · ' + t.title)
      + '</div><div class="resource-tags">'
      + '<span class="resource-chip">' + esc(info.provider || '—') + '</span>'
      + '<span class="resource-chip">' + esc(info.model) + '</span>'
      + '<span class="resource-chip">Effort: ' + esc(info.effort || '—') + '</span>'
      + '<span class="resource-chip">' + (langRu ? 'Сложность ' : 'Score ') + esc(info.score ?? '—') + '/100</span>'
      + '</div><div class="resource-reason">' + esc(info.reason || '—') + '</div></div>';
  }).join('');
  const proposals = T.filter(t => t.plannedRouting && !t.routing);
  const blockedProposals = proposals.filter(t => t.plannedRouting.status === 'blocked');
  const proposalItems = proposals.map(t => {
    const p = t.plannedRouting;
    return '<div class="resource-item"><div class="resource-title">' +
      esc(t.id + ' · ' + t.title) + '</div><div class="resource-tags">' +
      '<span class="resource-chip">' + (p.status === 'blocked' ?
        (langRu ? 'ЗАБЛОКИРОВАНО' : 'BLOCKED') : (langRu ? 'НЕ ПРИМЕНЕНО' : 'NOT APPLIED')) + '</span>' +
      '<span class="resource-chip">' + esc(p.provider || '—') + '</span>' +
      '<span class="resource-chip">' + esc(p.model || '—') + '</span>' +
      '<span class="resource-chip">Effort: ' + esc(p.effort || '—') + '</span>' +
      '<span class="resource-chip">' + esc(p.profile || '—') + '</span>' +
      '<span class="resource-chip">' + esc(p.score ?? '—') + '/100</span>' +
      '</div><div class="resource-reason">' +
      (langRu ? 'Предложение, не запуск: ' : 'Plan only, not executed: ') +
      esc(p.error || p.reason || '—') + '</div></div>';
  }).join('');
  const usageEvents = Array.isArray(S.usageEvents) ? S.usageEvents.filter(e =>
    e && Number.isSafeInteger(e.input) && Number.isSafeInteger(e.output) &&
    e.input >= 0 && e.output >= 0) : [];
  const tokensInput = usageEvents.reduce((n,e) => n + e.input,0);
  const tokensOutput = usageEvents.reduce((n,e) => n + e.output,0);
  const cacheRead = usageEvents.reduce((n,e) => n + (Number.isSafeInteger(e.cacheRead) ? e.cacheRead : 0),0);
  const cacheWrite = usageEvents.reduce((n,e) => n + (Number.isSafeInteger(e.cacheWrite) ? e.cacheWrite : 0),0);
  const budget = Number.isSafeInteger(S.budgetTokens) && S.budgetTokens > 0 ? S.budgetTokens : null;
  const countedTokens = tokensInput + tokensOutput;
  const budgetPercent = budget && usageEvents.length ? Math.min(100,Math.round(100*countedTokens/budget)) : null;
  const numberFormat = n => new Intl.NumberFormat(langRu?'ru-RU':'en-US').format(n);
  const tokenSummary = usageEvents.length
    ? '<div class="resource-usage" aria-label="' + (langRu ? 'Учтённые токены' : 'Reported tokens') + '">'
      + '<div><b>' + numberFormat(tokensInput) + '</b><span>' + (langRu ? 'Входные' : 'Input') + '</span></div>'
      + '<div><b>' + numberFormat(tokensOutput) + '</b><span>' + (langRu ? 'Выходные' : 'Output') + '</span></div>'
      + '<div><b>' + numberFormat(cacheRead) + '</b><span>' + (langRu ? 'Кэш чтения' : 'Cache read') + '</span></div>'
      + '<div><b>' + numberFormat(cacheWrite) + '</b><span>' + (langRu ? 'Кэш записи' : 'Cache write') + '</span></div>'
      + '</div>'
    : '<p class="muted">' + (langRu ? 'Учёт токенов: данных пока нет.' : 'Token telemetry: no data yet.') + '</p>';
  const budgetLine = budget
    ? '<div class="resource-budget"><div class="resource-budget-head"><span>'
      + (langRu ? 'Лимит учтённых токенов' : 'Recorded token threshold')
      + '</span><b>' + numberFormat(usageEvents.length?countedTokens:0)
      + ' / ' + numberFormat(budget) + '</b></div>'
      + '<div class="resource-budget-track" role="progressbar" aria-valuemin="0" aria-valuemax="' + budget
      + '" aria-valuenow="' + Math.min(budget,usageEvents.length?countedTokens:0)
      + '"><i style="width:' + (budgetPercent || 0) + '%"></i></div></div>'
    : '';
  const routeNotes = (S.sequentialHost ? '<p class="muted" id="sequential-host-notice">' +
      (langRu ? 'Последовательный режим: один таск за раз, тесты проверяет хост. Модель и Effort текущей GUI-сессии не подтверждены Autopilot; субагент не создаётся.' :
      'Sequential host mode: one ticket at a time, tests verified by the host. The current GUI model and Effort are NOT attested by Autopilot; no child agent is created.') +
      '</p>' : '')
    + (blockedProposals.length ? '<p id="model-routing-blocked-notice" class="resource-reason stale" role="status">' +
      (langRu ? 'БЛОКИРОВКА: ' : 'BLOCKED: ') + blockedProposals.length +
      (langRu ? ' задач(и) без применённого назначения. Проверьте поддержку точных моделей и Effort в реальном хосте, затем подтвердите каталог возможностей и выполните plan-models --apply. До проверки не запускайте субагентов.' :
      ' task(s) without applied routes. Verify exact model and Effort support in the real host, then attest the capability catalog and run plan-models --apply. Do not spawn subagents until verified.') + '</p>' : '')
    + (routed.length ? '<p id="model-routing-runtime-notice" class="muted">' +
      (langRu ? 'Записанный маршрут или сохранённый профиль не подтверждает фактический запуск субагента, модель и Effort в GUI.' :
      'A recorded route or saved profile does not attest actual GUI child execution, model or Effort.') + '</p>' : '');
  const resourceFooter = '<div class="resource-footer">' + (langRu ?
      'Стоимость: нет проверенных данных. Учёт токенов — сообщения от инструментов (' + usageEvents.length +
      '); входные и кэшированные токены могут пересекаться. Лимит блокирует новые задачи лишь после регистрации расхода.' :
      'Cost: no verified billing data. Token counts are tool reports (' + usageEvents.length +
      '); input and cache counters can overlap. The budget only blocks new tasks after usage is reported.')
    + '</div>';
  const resourceBlock = '<section class="card w resource-card"><div class="whead">'
    + '<h3 class="wt">' + (langRu ? 'Модели и ресурсы' : 'Models & resources') + '</h3>'
    + '<span>' + (langRu ? 'Маршруты записаны: ' : 'Routes recorded: ') + routed.length + '/' + T.length + '</span></div>'
    + routeNotes
    + (routed.length ? '<div class="resource-list">' + resourceItems + '</div>' :
      (proposals.length ? '<p class="muted">' + (langRu ?
        'Модель и Effort рассчитаны на этапе планирования; профили не применены и реальный GUI не подтверждён.' :
        'Model and Effort calculated at planning time; profiles not applied and live GUI unverified.') +
        '</p>' : '<p class="muted">' + (langRu ? 'Назначения моделей пока не зарегистрированы.' :
        'No per-task model assignments recorded yet.') + '</p>'))
    + (proposals.length ? '<div class="resource-list" id="planned-model-routes">' + proposalItems + '</div>' : '')
    + '<div class="resource-meters">' + tokenSummary + budgetLine + '</div>'
    + resourceFooter + '</section>';

  // ——— Isolation & recovery; read-only health indicators ———
  const isolated = T.filter(t => t.worktree || t.retries || t.repairs);
  const isolationRows = isolated.map(t => {
    const wt = t.worktree;
    const status = wt && wt.status ? wt.status : (langRu ? 'не настроен' : 'not configured');
    const attempts = Number(t.retries) || 0;
    const repairs = Number(t.repairs) || 0;
    const advice = t.retryAdvice;
    const parts = wt
      ? '<span class="resource-chip">' + (langRu ? 'Рабочая копия' : 'Worktree') + ': ' + esc(status) + '</span>'
      : '';
    return '<div class="resource-item"><div class="resource-title">' + esc(t.id + ' · ' + t.title)
      + '</div><div class="resource-tags">' + parts
      + '<span class="resource-chip">' + (langRu ? 'Повторы' : 'Retries') + ': ' + attempts + '</span>'
      + '<span class="resource-chip">' + (langRu ? 'Исправления' : 'Repairs') + ': ' + repairs + '</span>'
      + '</div>'
      + (advice && advice.why ? '<div class="resource-reason">' + esc(advice.category || '') + ': ' + esc(advice.why) + '</div>' : '')
      + '</div>';
  }).join('');
  const isolationBlock = isolated.length
    ? '<section class="card w resource-card"><div class="whead"><h3 class="wt">'
      + (langRu ? 'Изоляция и восстановление' : 'Isolation & recovery')
      + '</h3><span>' + isolated.length + '</span></div><div class="resource-list">'
      + isolationRows + '</div><div class="resource-footer">'
      + (langRu
        ? 'Статусы отражают журнал Autopilot, не проверяют фактическую работу внешнего агента. Для диагностики используйте worktree status.'
        : 'Statuses reflect the Autopilot ledger, not an independent check of external agent execution. Use worktree status to inspect checkout health.')
      + '</div></section>' : '';

  // ——— блоки для тем (данные посчитаны выше; здесь только упаковка) ———
  const W = L.vw;
  const emptyBox = text => `<div class="empty">${ic('list','m')}<span>${text}</span></div>`;
  const emptyCard = (title, text) => `<section class="card w"><div class="whead"><h3 class="wt">${title}</h3></div>${emptyBox(text)}</section>`;
  const moreBtn = (key, hidden) => `<button type="button" class="btn-soft" data-more="${key}">${UI.open[key] ? L.collapse + ic('up') : L.more(hidden) + ic('chev')}</button>`;
  const rowsList = (key, rows, n) => (UI.open[key] ? rows : rows.slice(0, n)).join('')
    + (rows.length > n ? `<div class="more">${moreBtn(key, rows.length - n)}</div>` : '');
  const tiles = `<div class="tiles">${tileReq}${tileTk}${tileTests}${tile4}</div>`;

  const kpi = (title, value, sub, dim) => `<section class="card tile w"><span class="tk">${title}</span><span class="tv${dim ? ' dim' : ''}">${value}</span><span class="ts">${sub}</span></section>`;
  const ofT = n => `${n}<small>${L.of} ${T.length}</small>`;
  const trees = T.filter(t => t.worktree);
  const treeStates = [...new Set(trees.map(t => t.worktree.status).filter(Boolean))];
  const redo = retries + repairs;
  const kpiRow = '<div class="tiles">'
    + (usageEvents.length ? kpi(W.kTokens, numberFormat(countedTokens), `${W.kIn} ${numberFormat(tokensInput)} · ${W.kOut} ${numberFormat(tokensOutput)}`)
      : kpi(W.kTokens, '—', W.empty, true))
    + (T.length ? kpi(W.kActive, ofT(activeWorkers.length), activeWorkers.length ? esc(activeWorkers.map(t => t.id).join(', ')) : W.empty)
      : kpi(W.kActive, '—', W.empty, true))
    + (trees.length ? kpi(W.kTrees, ofT(trees.length), esc(treeStates.join(' · ')) || W.empty) : kpi(W.kTrees, '—', W.empty, true))
    + (T.length ? kpi(W.kRetries, String(redo), redo ? [repairs ? L.tkParts.repair(repairs) : '', retries ? L.tkParts.retry(retries) : ''].filter(Boolean).join(' · ') : W.empty, !redo)
      : kpi(W.kRetries, '—', W.empty, true))
    + '</div>';

  const trackCard = `<section class="card w trackcard"><div class="whead"><h3 class="wt">${W.tStages}</h3></div><div class="track" role="list">${segs}</div></section>`;
  const attention = activeWorkers.concat(failedWorkers);
  const none = `<p class="muted">${W.empty}</p>`;
  const tasksEmpty = emptyCard(L.build, t0 ? L.t0 : L.noTickets);
  const emptyGantt = emptyCard(W.tGantt, t0 ? L.t0 : L.noTickets);
  const waitingT = T.filter(t => t.status === 'pending');
  const activeCard = T.length
    ? `<section class="card w"><div class="whead"><h3 class="wt">${W.tActive}</h3><span>${attention.length}</span></div>${attention.length ? rowsList('act', attention.map(taskRow), 4) : none}</section>`
    : tasksEmpty;
  const waitingCard = T.length
    ? `<section class="card w"><div class="whead"><h3 class="wt">${W.tWaiting}</h3><span>${waitingT.length}</span></div>${waitingT.length ? rowsList('wt', waitingT.map(taskRow), 4) : none}</section>`
    : '';
  const reqSummary = R.total
    ? `<section class="card w"><div class="whead"><h3 class="wt">${W.tReq}</h3><span>${rk.done} ${L.of} ${live}</span></div>${reqStack}
        <p class="muted" style="margin-top:10px">${reqPartsText}</p>${T.length ? `<p class="muted" style="margin-top:6px">${L.g3ok(live, T.length)}</p>` : ''}</section>`
    : emptyCard(W.tReq, L.reqLater);
  const feedView = feedCard || emptyCard(L.feed, W.empty);
  const wordsView = wordsCard || emptyCard(L.words, L.reqLater);
  const blindView = blindCard || emptyCard(L.blind, W.empty);
  const reviewView = reportCard + concernsCard || emptyCard(W.tReview, W.empty);

  const byTicketId = (a, b) => String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
  const feedItems = feedEvents.slice().reverse().map(feedRow).filter(Boolean);
  const feedAll = feedItems.length
    ? `<section class="card w"><div class="whead"><h3 class="wt">${W.tFeedAll}</h3><span>${feedItems.length}</span></div>${rowsList('feed', feedItems, 15)}</section>`
    : emptyCard(W.tFeedAll, W.empty);

  const debtCard = `<section class="card w"><div class="whead"><h3 class="wt">${W.tDebt}</h3><span>${env.length + ph.length + asm.length}</span></div>${keysBlock + phBlock + asmBlock || none}</section>`;

  // Ждущий таск без маршрута тоже получает строку: токенов 0, рабочей копии нет. Причин выбора без данных не выдумываем.
  const unrouted = T.filter(t => t.status === 'pending' && !t.routing && !t.plannedRouting);
  const routeRows = routed.map(t => [t, t.routing, '']).concat(proposals.map(t => [t, t.plannedRouting, t.plannedRouting.status === 'blocked' ? W.blocked : W.planned]),
    unrouted.map(t => [t, {}, ''])).sort((a, b) => byTicketId(a[0], b[0]));
  const PILLK = {done: 'p-done', now: 'p-now', rev: 'p-rev', fix: 'p-rev', bad: 'p-bad', wait: 'p-mut'};
  // Токены по таскам — из usageEvents[].ticket; нет событий с таском — нет и столбца.
  const tokBy = new Map();
  usageEvents.forEach(e => tokBy.set(String(e.ticket), (tokBy.get(String(e.ticket)) || 0) + e.input + e.output));
  const maxTok = Math.max(1, ...tokBy.values());
  const hasTok = unrouted.length > 0 || routeRows.some(([t]) => tokBy.has(String(t.id)));
  const hasTree = unrouted.length > 0 || routeRows.some(([t]) => t.worktree && t.worktree.status);
  const routeCols = [W.cTask, W.cProvider, W.cModel, W.cScore, W.cWhy].concat(hasTok ? [W.tTokens] : [], hasTree ? [W.cTree] : []);
  const routeRow = ([t, p, tag]) => {
    const k = kindOf(t).k, n = tokBy.get(String(t.id));
    return `<tr><td>${esc(t.id + ' · ' + t.title)}<br><span class="pill ${PILLK[k]}">${L.chip[k]}</span></td><td>${esc(p.provider || '—')}</td>`
      + `<td><span class="mchip">${esc(p.model || '—')}${p.effort ? ' · ' + esc(p.effort) : ''}</span>${tag ? ` <span class="pill p-mut">${tag}</span>` : ''}</td>`
      + `<td>${esc(p.score ?? '—')}</td><td>${esc(p.reason || p.error || '')}</td>`
      + (hasTok ? `<td>${n ? `<span class="tokbar" aria-hidden="true"><i style="width:${Math.max(3, Math.round(n / maxTok * 100))}%"></i></span><span class="mono">${numberFormat(n)}</span>` : tokBy.has(String(t.id)) || (t.status === 'pending' && !t.routing && !t.plannedRouting) ? '0' : '—'}</td>` : '')
      + (hasTree ? `<td>${t.worktree && t.worktree.status ? `<span class="pill p-mut">${esc(t.worktree.status)}</span>`
        : t.status === 'pending' ? `<span class="pill p-mut">${W.notCreated}</span>` : '—'}</td>` : '') + '</tr>';
  };
  const routesCard = `<section class="card w"><div class="whead"><h3 class="wt">${W.tRoutes}</h3><span>${routed.length}/${T.length}</span></div>${routeNotes}${routeRows.length
    ? `<div class="tablewrap"><table class="routes"><thead><tr>${routeCols.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${
      routeRows.map(routeRow).join('')}</tbody></table></div>` : emptyBox(W.empty)}</section>`;
  const tokensCard = `<section class="card w resource-card"><div class="whead"><h3 class="wt">${W.tTokens}</h3><span>${usageEvents.length}</span></div><div class="resource-meters flat">${tokenSummary}${budgetLine}</div>${resourceFooter}</section>`;
  const isolationView = isolationBlock || emptyCard(W.tIsolation, W.empty);

  const checks = [[W.cResult, fin && S.result], [L.tTests, tests], [L.blind, B], [L.report, report.length], [L.assumptions, asm.length], [L.concerns, concerns.length]];
  const summaryCard = `<section class="card w"><div class="whead"><h3 class="wt">${W.tSummary}</h3></div>${fin ? '' : `<p class="muted">${W.notDone}</p>`}${
    checks.map(([name, ok]) => `<div class="req"><p>${name}</p><span class="pill ${ok ? 'p-done' : 'p-mut'}">${ok ? W.have : (fin ? W.none : W.empty)}</span></div>`).join('')}</section>`;

  // ——— Обзор и Компактный: кольцо, прогноз, маршрут этапов, диаграмма Ганта ———
  // Блок без данных не рисуется. Прогноз — только когда есть готовые таски с началом и концом (median).
  const fmtK = n => n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);
  const ringHTML = cls => {
    const a = live ? Math.min(100, rk.done / live * 100) : 0, b = live ? Math.min(100 - a, rk.work / live * 100) : 0;
    const label = live ? `${rk.done} ${L.of} ${live} ${W.ringCap}` : W.ringNone;
    return `<div class="ring${cls}" role="img" aria-label="${esc(label)}" style="background:conic-gradient(var(--done) 0 ${a.toFixed(1)}%,var(--now) ${a.toFixed(1)}% ${(a + b).toFixed(1)}%,var(--line) ${(a + b).toFixed(1)}% 100%)"><div class="ring-in"><b>${live ? `${rk.done}<small> / ${live}</small>` : '—'}</b><span>${live ? W.ringCap : W.ringNone}</span></div></div>`;
  };
  const fore = eta && median ? {v: fmtDur(Math.round(left)),
    range: eta[1] < 60 ? `${eta[0]}–${eta[1]} ${L.min}` : `${fmtDur(eta[0])} — ${fmtDur(eta[1])}`,
    by: hhmm(new Date(Date.now() + left * 60000))} : null;
  const foreBlock = fore
    ? `<div class="fc"><span class="fc-k">${W.toEnd}</span><b class="fc-v">≈ ${fore.v}</b><span class="fc-s">${W.likely} ${fore.range}, ${W.till} ${fore.by}</span></div>`
    : waiting ? `<div class="fc"><span class="fc-k">${L.waitState}</span><b class="fc-v"><span data-since="${esc(waiting.since)}">${fmtClock(spanMs(waiting.since, null))}</span></b><span class="fc-s">${L.waitBig}</span></div>` : '';
  const lastEv = feedEvents.slice().reverse().map(e => [e, evText(e)]).find(x => x[1]);
  const evNote = lastEv ? `<div class="evnote"><span class="mono">${hhmm(lastEv[0].t)}</span><span>${esc(lastEv[1])}</span></div>` : '';
  const chipState = `<span class="chip-state"><i aria-hidden="true"></i>${esc(stateLine.replace(/<[^>]*>/g, ''))}</span>`;
  const testsVal = tests ? `${esc(tests.passed)} · ${tests.failed ? esc(L.testsBad(tests.failed)) : L.testsOk}` : '';
  const timeVal = S.startedAt ? timerHTML(S.startedAt, S.finishedAt) : '';
  const tokVal = usageEvents.length ? fmtK(countedTokens) : '';
  const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  const stats = [T.length ? kv(W.kAgents, activeWorkers.length) : '', testsVal && kv(L.tTests, testsVal), timeVal && kv(W.kTime, timeVal),
    tokVal && kv(W.kTokens, tokVal + (budget ? ` ${L.of} ${fmtK(budget)}` : ''))].filter(Boolean).join('');
  const ovHero = `<section class="card ovh w ${heroCls}" aria-live="polite">${ringHTML('')}
    <div class="ovh-main">${chipState}<h2>${h2}</h2>${(ovLead ?? lead) ? `<p class="lead">${ovLead ?? lead}</p>` : ''}${hint}${evNote}</div>
    ${foreBlock || stats ? `<div class="ovh-side">${foreBlock}${stats ? `<div class="kvs">${stats}</div>` : ''}</div>` : ''}</section>`;
  const ctile = (k, v) => `<div class="ctile"><span>${k}</span><b>${v}</b></div>`;
  const ctiles = [testsVal && ctile(L.tTests, testsVal), timeVal && ctile(W.kTime, timeVal), tokVal && ctile(W.kTokens, tokVal)].filter(Boolean);
  const cHero = `<section class="card cmp-hero w ${heroCls}" aria-live="polite"><div class="cmp-top">${ringHTML(' sm')}
    <div class="cmp-side">${chipState}${foreBlock}</div></div><h2>${h2}</h2>${evNote}${ctiles.length ? `<div class="ctiles">${ctiles.join('')}</div>` : ''}</section>`;

  // Маршрут этапов: минуты пройденных, часы текущего, «впереди» у остальных — состояние всегда словами.
  const rsInfo = s => {
    if (s.status === 'done') {
      const a = toMs(s.startedAt), b = toMs(s.finishedAt), w = a != null && b != null ? Math.round(waitedIn(a, b) / 60000) : 0;
      return {cls: 'done', mark: ic('check', 'xs'), sub: a != null && b != null
        ? `${Math.max(1, Math.round((activeMs(s.startedAt, s.finishedAt) || 0) / 60000))} ${L.min}${w >= 1 ? ' ' + W.waited(w) : ''}` : '—'};
    }
    if (s.status === 'active') return {cls: 'now', mark: '<i></i>',
      sub: (waiting ? L.waitingSt : s.startedAt ? timerHTML(s.startedAt, null) : '—') + ' · ' + W.going};
    if (s.status === 'failed') return {cls: 'bad', mark: ic('x', 'xs'), sub: L.failedSt};
    if (s.status === 'skipped') return {cls: 'skip', mark: ic('chev', 'xs'), sub: L.skipped};
    return {cls: 'pend', mark: '', sub: L.ahead};
  };
  const route = `<ol class="route">${stages.map(s => { const r = rsInfo(s);
    return `<li class="rs ${r.cls}"><div class="rs-top"><span class="rs-mark">${r.mark}</span><span class="rs-line"></span></div><b class="rs-name">${esc(stName(s))}</b><span class="rs-sub">${r.sub}</span></li>`; }).join('')}</ol>`;
  const curSt = activeStage || failedStage || stages.find(s => s.status === 'pending') || stages[stages.length - 1];
  const curNo = stages.indexOf(curSt) + 1;
  const stageOf = esc(W.cStage(curNo, stages.length, stName(curSt)));
  const nextNames = stages.slice(curNo).filter(s => s.status === 'pending').slice(0, 2).map(stName);
  const cstrip = `<section class="card w"><div class="cstrip"><div class="cs-head"><b>${stageOf}</b><span class="cs-sub">${rsInfo(curSt).sub}</span></div>
    <div class="cs-bar" role="img" aria-label="${stageOf}">${stages.map(s => `<i class="${rsInfo(s).cls}"></i>`).join('')}</div>
    ${nextNames.length ? `<p class="muted">${esc(W.cNext(nextNames.join(' → ')))}</p>` : fin ? `<p class="muted">${W.cDone}</p>` : ''}</div></section>`;

  // Компактный: только то, что нужно от вас, — ключи и заглушки; решения за вас и пустое «пока ничего» в узкой панели не нужны.
  const needSlim = keysBlock + phBlock
    ? `<div class="ask-card"><section class="card w"><div class="whead"><h3 class="wt">${fin ? L.prep : L.need}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section></div>` : '';

  // «Таймлайн»: пять карточек (только с данными), герой с прогнозом и маршрутом этапов.
  const tileTok = usageEvents.length
    ? `<section class="card tile w"><span class="tk">${W.kTokens}</span><span class="tv">${fmtK(countedTokens)}${budget ? `<small>${L.of} ${fmtK(budget)}</small>` : ''}</span>${
        budget ? `<div class="stack" aria-hidden="true"><i class="f-done" style="flex:${budgetPercent || 0}"></i><i class="f-idle" style="flex:${100 - (budgetPercent || 0)}"></i></div>` : ''}
        <span class="ts">${W.kIn} ${numberFormat(tokensInput)} · ${W.kOut} ${numberFormat(tokensOutput)}</span></section>` : '';
  const tlTilesList = [R.total && tileReq, T.length && tileTk, tests && tileTests, tileTok, S.startedAt && tileTime].filter(Boolean);
  const tlTiles = tlTilesList.length ? `<div class="tiles t5">${tlTilesList.join('')}</div>` : '';
  const tlHero = `<section class="card ovh tlh w ${heroCls}" aria-live="polite"><div class="ovh-main">${chipState}<h2>${h2}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${hint}</div>
    ${foreBlock ? `<div class="ovh-side">${foreBlock}</div>` : ''}${route}</section>`;

  // «Итог»: герой с карточками справа — рабочее время, тесты, токены. «Коммитов» в state.js нет — карточки нет.
  const kcard = (k, v, sub) => `<div class="kcard"><span class="kk">${k}</span><b>${v}</b>${sub ? `<span class="ks">${sub}</span>` : ''}</div>`;
  const kcards = [timeVal && kcard(W.kTime, timeVal, L.timeSub),
    tests && kcard(L.tTests, esc(tests.passed), tests.failed ? esc(L.testsBad(tests.failed)) : L.testsOk),
    tokVal && kcard(W.kTokens, tokVal, budget ? `${L.of} ${fmtK(budget)}` : '')].filter(Boolean);
  const sumHero = `<section class="card ovh sum-h w ${heroCls}" aria-live="polite">${ringHTML('')}
    <div class="ovh-main">${chipState}<h2>${h2}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${hint}${evNote}</div>
    ${foreBlock || kcards.length ? `<div class="ovh-side">${foreBlock}${kcards.length ? `<div class="kcards">${kcards.join('')}</div>` : ''}</div>` : ''}</section>`;

  // Диаграмма Ганта: настоящие отрезки по startedAt/finishedAt; ждущие таски — пунктиром после тех, от кого зависят.
  const GT = 60000, gNow = Date.now(), placed = {};
  const place = (t, seen) => {
    if (t.id in placed) return placed[t.id];
    const a0 = toMs(t.startedAt), f0 = toMs(t.finishedAt);
    let r = null;
    if (t.status !== 'pending' && a0 != null) {
      r = {a: a0, b: Math.max(f0 ?? gNow, a0), est: false,
        tail: f0 == null && t.status === 'in-progress' && median ? Math.max(0, leftFor(t)) * GT : 0};
    } else if (t.status === 'pending') {
      const up = new Set(seen).add(t.id);
      const ends = (t.blockedBy || []).filter(id => byId[id] && !up.has(id)).map(id => place(byId[id], up)).filter(Boolean).map(x => x.b + x.tail);
      const a = Math.max(gNow, ...ends);
      r = {a, b: a + (median || 10) * GT, tail: 0, est: true};
    }
    return placed[t.id] = r;
  };
  const gRows = T.slice().sort((x, y) => ((x.wave ?? 1) - (y.wave ?? 1)) || byTicketId(x, y))
    .map(t => [t, place(t, new Set())]);  // у таска без отметок времени места на оси нет (null), но строка остаётся
  const timedRows = gRows.filter(x => x[1]);
  let gantt = '', ganttFull = '', miniGantt = '';
  if (gRows.length) {
    const gFrom = Math.min(...timedRows.map(x => x[1].a), ...(fin && timedRows.length ? [] : [gNow]));
    const gTo = Math.max(...timedRows.map(x => x[1].b + x[1].tail), ...(fin && timedRows.length ? [] : [gNow]));
    const gSpan = Math.max(gTo - gFrom, 10 * GT) * 1.02;
    const pct = ms => ((ms - gFrom) / gSpan * 100).toFixed(2);
    const step = [5, 10, 15, 30, 60, 120, 240, 720, 1440].map(m => m * GT).find(x => gSpan / x <= 7) || 1440 * GT;
    const off = new Date(gFrom).getTimezoneOffset() * GT, ticks = [];
    for (let x = Math.ceil((gFrom - off) / step) * step + off; x <= gFrom + gSpan && ticks.length < 12; x += step) ticks.push(x);
    const grid = timedRows.length ? ticks.map(x => `<i class="gx-grid" style="left:${pct(x)}%"></i>`).join('')
      + (fin ? '' : `<i class="gx-nowline" style="left:${pct(gNow)}%"></i>`) : '';
    const axis = !timedRows.length ? '' : `<div class="gx-axis"><span class="gx-pad"></span><div class="gx-ticks">${ticks.map(x => `<span style="left:${pct(x)}%">${hhmm(new Date(x))}</span>`).join('')}${
      fin ? '' : `<span class="gx-nowtag" style="left:${pct(gNow)}%">${W.nowTag} ${hhmm(new Date(gNow))}</span>`}</div><span class="gx-pad"></span></div>`;
    const gBar = (t, p, mini) => {
      const k = p.est ? 'wait' : kindOf(t).k, left = pct(p.a), w = Math.max(1.4, pct(p.b) - left);
      const m = t.status === 'done' && mins(t) ? mins(t) : Math.max(1, Math.round((p.b - p.a) / GT));
      const dur = p.est ? (median ? `~${median} ${L.min}` : '') : `${m} ${L.min}`;
      const tiny = w < (mini ? 14 : 12) && !p.est;  // узкий отрезок: только число минут (состояние — плашка, значок, подсказка)
      const label = tiny ? String(m) : mini ? (dur || L.chip.wait) : (w >= 22 || !dur) ? [L.chip[k], dur].filter(Boolean).join(' · ') : dur;
      return `<span class="gx-bar gx-${k}" style="left:${left}%;width:${w.toFixed(2)}%" title="${esc(t.title)}: ${esc(L.chip[k] + (dur ? ' · ' + dur : ''))}">${p.est || (tiny && mini) ? '' : ic(kindOf(t).icon, 'xs')}${esc(label)}</span>`
        + (p.tail ? `<i class="gx-tail" style="left:${pct(p.b)}%;width:${Math.max(1.4, pct(p.b + p.tail) - pct(p.b)).toFixed(2)}%">~${Math.round(p.tail / GT)} ${L.min}</i>` : '');
    };
    // Заметка под строкой Ганта: причина, замечание ревью или последняя починка, метка «ремонты · повторы»; нет данных — нет блока.
    // Длинное обрезается до NOTE_MAX знаков, остальное по «показать ещё» (data-more); полного текста в атрибутах нет.
    const NOTE_MAX = 140;
    const gNote = t => {
      const n = noteOf(t), redo = redoOf(t);
      if (!n && !redo) return '';
      const key = 'nt:' + t.id, chars = n ? [...n[1]] : [], long = chars.length > NOTE_MAX, open = !!UI.open[key];
      const text = long && !open ? chars.slice(0, NOTE_MAX).join('').trimEnd() + '…' : (n ? n[1] : '');
      return `<div class="tl-note gx-note${n ? ' ' + n[0] : ''}">${n ? ic(KIND[t.status].icon) : ''}<span>${esc(text)}${
        redo ? `${text ? ' ' : ''}<span class="gx-redo">${text ? '· ' : ''}${esc(redo)}</span>` : ''}</span>${
        long ? `<button type="button" class="btn-soft" data-more="${esc(key)}">${open ? L.collapse + ic('up') : W.noteMore + ic('chev')}</button>` : ''}</div>`;
    };
    const subOf = t => [L.wave(t.wave ?? 1), (t.blockedBy || []).length ? W.after(t.blockedBy) : ''].filter(Boolean).join(' · ');
    const row = ([t, p]) => `<div class="gx-row"><div class="gx-lab"><span class="gx-id">${esc(t.id)}</span><div><b>${esc(t.title)}</b><small>${esc(subOf(t))}</small></div></div>
      <div class="gx-lane">${grid}${p ? gBar(t, p, false) : `<span class="gx-none">${W.noMarks}</span>`}</div><div class="gx-mdl">${t.routing && t.routing.model
        ? `<span class="mchip">${esc(t.routing.model)}${t.routing.effort ? ' · ' + esc(t.routing.effort) : ''}</span>` : ''}</div>${gNote(t)}</div>`;
    const miniRow = ([t, p]) => `<div class="gx-row"><div class="gx-lab"><span class="gx-id">${esc(t.id)}</span><b>${esc(t.title)}</b><span class="pill ${PILLK[kindOf(t).k]}">${L.chip[kindOf(t).k]}</span></div>
      <div class="gx-lane">${grid}${p ? gBar(t, p, true) : `<span class="gx-none">${W.noMarks}</span>`}</div>${gNote(t)}</div>`;
    const legend = `<div class="gx-legend">${['done', 'now', 'rev', 'wait'].map(k => `<span><i class="sw sw-${k}"></i>${k === 'wait' ? W.lgPlan : L.chip[k]}</span>`).join('')}</div>`;
    const ganttCard = rows => `<section class="card w"><div class="whead"><div><h3 class="wt">${W.tGantt}</h3><p class="muted">${W.gSub}</p></div>${legend}</div>
      <div class="gx">${axis}${rows}</div></section>`;
    // «Обзор» — краткий (до восьми строк, без разделителей волн: волна подписана в строке), «Таймлайн» — подробный: все таски, волны названы.
    gantt = ganttCard(rowsList('gt', gRows.map(row), 8));
    ganttFull = ganttCard(gRows.map((x, i) => (i && (x[0].wave ?? 1) === (gRows[i - 1][0].wave ?? 1) ? '' : `<div class="wave">${esc(L.wave(x[0].wave ?? 1))}</div>`) + row(x)).join(''));
    miniGantt = `<section class="card w"><div class="whead"><h3 class="wt">${W.tGantt}</h3></div>
      <div class="gx mini">${axis}${rowsList('gtm', gRows.map(miniRow), 8)}</div>${legend}</section>`;
  }
  const gOk = g => G[g] && G[g].ok;
  const gchips = `<section class="card w"><div class="whead"><h3 class="wt">${L.gates}</h3><span>${L.gatesOf(okGates)}</span></div><div class="gchips">${
    ['G1', 'G2', 'G3', 'G4'].map(g => `<span class="gchip ${gOk(g) ? 'ok' : G[g] ? 'warn' : 'wait'}">${gOk(g) ? '✓' : G[g] ? '!' : '○'} ${g} · ${L.gT[g]}</span>`).join('')}</div></section>`;
  const feedShort = feedEvents.slice(-5).reverse().map(feedRow).join('');
  const feedCompact = feedShort ? `<section class="card w"><div class="whead"><h3 class="wt">${L.feed}</h3></div>${feedShort}</section>` : emptyCard(L.feed, W.empty);

  // ——— «Требования» и «Итог»: путь каждой фразы брифа ———
  // У требования в state.js нет ссылок на таски, но у таска есть requirements[]: связь берём оттуда
  // (R03.1 — это R03). Что в state.js нет — то не рисуется: ни «было/стало», ни решений за вас.
  const reqBase = x => String(x).split('.')[0];
  const linked = id => T.filter(t => Array.isArray(t.requirements) && t.requirements.some(x => reqBase(x) === id));
  const mism = (B && Array.isArray(B.mismatches) ? B.mismatches : []).map(m => {
    const x = /^([RGA]\d+\w*)\s+[—–-]\s+(.*)$/.exec(m); return x ? {id: x[1], text: x[2]} : {id: '', text: String(m)}; });
  const reqRows = reqList.map(r => ({r, k: REQ_KIND[r.status] || 'open', lk: linked(r.id)}));
  // Семь этапов: записано · спецификация · таск · код · тесты · ревью · приёмка → done | now | wait | bad | skip.
  const stagesOf = ({r, k, lk}) => {
    if (k === 'dropped' || k === 'deferred') return ['done'].concat(Array(6).fill('skip'));
    const every = f => lk.length > 0 && lk.every(f), some = f => lk.some(f);
    const st = t => t.status, allDone = k === 'done' || every(t => st(t) === 'done');
    const code = allDone ? 'done' : some(t => st(t) === 'failed') ? 'bad'
      : some(t => ['in-progress', 'repair'].includes(st(t))) ? 'now'
      : every(t => ['review', 'done'].includes(st(t))) ? 'done' : some(t => ['review', 'done'].includes(st(t))) ? 'now' : 'wait';
    return ['done', r.status !== 'open' || lk.length ? 'done' : 'wait', lk.length || ['in-ticket', 'done'].includes(r.status) ? 'done' : 'wait',
      code, allDone ? (some(t => t.tests && t.tests.failed) ? 'bad' : 'done') : 'wait',
      allDone ? 'done' : some(t => ['review', 'repair'].includes(st(t))) ? 'now' : 'wait',
      mism.some(m => m.id === r.id) ? 'bad' : B ? 'done' : 'wait'];
  };
  const mxWord = (s, i) => s === 'done' ? W.mDone : s === 'now' ? (i === 3 ? W.mCode : W.mNow) : s === 'bad' ? (i === 6 ? W.mMis : W.mFail)
    : s === 'skip' ? '—' : (i === 6 && !fin ? W.mFinal : W.mWait);
  const mxMark = {done: ic('check', 'xs'), bad: ic('x', 'xs'), now: '<i></i>', wait: '', skip: ''};
  let matrixCard = '';
  if (reqRows.length) {
    const grid = reqRows.map(x => stagesOf(x));
    const liveRows = grid.filter((_, i) => !['dropped', 'deferred'].includes(reqRows[i].k));
    const rows = reqRows.map((x, n) => `<div class="mx-row"><div class="mx-req"><span class="rid">${esc(x.r.id)}</span><div><p>${q(esc(x.r.text), L.lang)}</p>
        <small>${x.lk.length ? esc(W.mTickets(x.lk.map(t => t.id))) : ''}${['dropped', 'deferred', 'placeholder'].includes(x.k) ? `${x.lk.length ? ' · ' : ''}${L.rs[x.k]}` : ''}</small></div></div>${
      grid[n].map((s, i) => `<div class="mx-c ${s}"><span class="mx-h">${W.mShort[i]}</span><span class="mx-m" aria-hidden="true">${mxMark[s]}</span><span class="mx-t">${mxWord(s, i)}</span></div>`).join('')}</div>`);
    const count = liveRows.length ? `<div class="mx-sum"><span>${W.mCount}</span>${W.mShort.map((_, i) => { const n = liveRows.filter(g => g[i] === 'done').length;
      return `<div><b>${n} / ${liveRows.length}</b><i class="mx-bar" aria-hidden="true"><i style="width:${Math.round(n / liveRows.length * 100)}%"></i></i></div>`; }).join('')}</div>` : '';
    matrixCard = `<section class="card w mx"><div class="whead"><div><h3 class="wt">${W.mTitle}</h3><p class="muted">${W.mSub}</p></div></div>
      <div class="mx-head"><span>${W.mReq}</span>${W.mLong.map(h => `<span>${h}</span>`).join('')}</div>${rowsList('mx', rows, 12)}${count}</section>`;
  }

  // «Итог»: вердикт по каждому требованию — где в проекте, тесты, ревью, слепая приёмка.
  const verdictRows = reqRows.map(({r, lk}) => {
    const passed = lk.reduce((n, t) => n + (t.tests && Number.isFinite(+t.tests.passed) ? +t.tests.passed : 0), 0);
    const fixed = lk.reduce((n, t) => n + (Number(t.repairs) || 0), 0);
    const review = !lk.length ? '—' : lk.every(t => t.status === 'done') ? (fixed ? W.rvFix(fixed) : W.rvOk)
      : lk.some(t => ['review', 'repair'].includes(t.status)) ? W.rvOn : W.rvWait;
    const blind = mism.some(m => m.id === r.id) ? `<span class="pill p-bad">${W.bBad}</span>` : B ? `<span class="pill p-done">${W.bOk}</span>` : `<span class="pill p-mut">${W.bWait}</span>`;
    return `<div class="vd-row"><span class="rid">${esc(r.id)}</span><p>${q(esc(r.text), L.lang)}</p>
      <span class="vd-w" data-l="${W.cWhere}">${lk.length ? esc(W.mTickets(lk.map(t => t.id))) : '—'}</span><span class="vd-t" data-l="${W.cTests}">${passed ? passed : '—'}</span>
      <span class="vd-r" data-l="${W.cReview}">${esc(review)}</span><span class="vd-b" data-l="${W.cBlind}">${blind}</span></div>`;
  });
  const verdictCard = verdictRows.length
    ? `<section class="card w vd"><div class="whead"><div><h3 class="wt">${W.sVerdict}</h3><p class="muted">${W.sVerdictSub}</p></div></div>
        <div class="vd-head"><span></span><span>${W.mReq}</span><span>${W.cWhere}</span><span>${W.cTests}</span><span>${W.cReview}</span><span>${W.cBlind}</span></div>${rowsList('vd', verdictRows, 12)}</section>` : '';
  // Расхождение приёмки — только текст: дашборд читает состояние, кнопок действий у него нет.
  const mismatchCard = mism.map(m => `<section class="card w mis"><h3 class="wt">${m.id ? W.sMis(esc(m.id)) : W.sMisAny}</h3><p>${esc(m.text)}</p></section>`).join('');
  const steps = fin ? [env.length && [W.nEnv(env.length), W.nEnvD], ph.length && [W.nPh(ph.length), W.nPhD],
    ...mism.map(m => m.id ? [W.nMis(m.id), W.nMisD] : [W.sMisAny, W.nMisD]), asm.length && [W.nAsm(asm.length), W.nAsmD]].filter(Boolean) : [];
  const nextCard = steps.length ? `<section class="card w"><div class="whead"><h3 class="wt">${W.sNext}</h3></div><ol class="steps">${
    steps.map(([a, b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol></section>` : '';
  const needSum = env.length || ph.length
    ? `<div class="ask-card"><section class="card w"><div class="whead"><h3 class="wt">${W.sNeed}</h3><span>${env.length + ph.length}</span></div>${keysBlock}${phBlock}</section></div>` : '';

  // ——— раскладка ———
  // Слева — длинное (слова, ход сборки в отчёте), справа — короткое; «Понадобится»
  // слева под словами, иначе правая колонка уходит вниз, а левая стоит пустой.
  const leftCol = fin ? [needCard, blindCard, buildCard, wordsCard] : [wordsCard, needCard];
  const rightCol = fin ? [gatesCard, reportCard, asmCard, concernsCard, addCard, feedCard]
                    : [gatesCard, feedCard, reportCard, concernsCard, addCard];
  // Остальные карточки «Классики» (слепая приёмка, отчёт, замечания…) — под «Твоими словами» в Обзоре.
  const shown = [buildCard, wordsCard, feedCard, gatesCard, needCard];
  const extras = leftCol.concat(rightCol).filter(x => x && !shown.includes(x)).join('');
  const when = S.startedAt ? (fin
    ? L.startedRange(new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}), hhmm(S.finishedAt))
    : L.started(new Date(S.startedAt).toDateString() === new Date().toDateString()
        ? `${L.today} ${hhmm(S.startedAt)}`
        : new Date(S.startedAt).toLocaleString(L.lang === 'en' ? 'en-GB' : 'ru-RU', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}))) : '';

  document.documentElement.lang = L.lang;
  document.documentElement.setAttribute('data-view', VIEW);  // палитра макетов включается всем видам, кроме «Классики»
  const app = document.getElementById('app');
  // A live refresh or language/filter click must not discard keyboard focus.
  // Only stable, locally generated attributes are used; no selector interpolation.
  const active = document.activeElement;
  const focusAttrs = ['data-focus-key','data-lang','data-theme','data-view','data-filter','data-more','data-refresh'];
  const focusAttr = active && typeof app.contains === 'function' && app.contains(active)
    ? focusAttrs.find(name => active.hasAttribute(name)) : null;
  const focusValue = focusAttr ? active.getAttribute(focusAttr) : null;
  const focusTag = focusAttr ? active.tagName : null;
  const focusId = !focusAttr && active && typeof app.contains === 'function' && app.contains(active)
    && ['mission','tasks','models','quality'].includes(active.id) ? active.id : null;
  const sectionTitle = (number, title, sub) =>
    `<div class="section-top"><span>${number}</span>${title}<small>${sub}</small></div>`;
  const page = VIEWS[VIEW]({L, S, T, fin, langRu, sectionTitle, hero, opsBlock, tiles, kpiRow, trackCard, tasksEmpty, activeCard, waitingCard,
    buildCard, reqSummary, gatesCard, feedView, wordsView, blindView, reviewView, feedAll, debtCard, routesCard, tokensCard,
    isolationView, summaryCard, blindCard, reportCard, concernsCard, addCard, asmCard, resourceBlock, isolationBlock, leftCol, rightCol, activeWorkers,
    ovHero, route, gantt, ganttFull, emptyGantt, matrixCard, verdictCard, mismatchCard, nextCard, needSum, wordsCard, needCard, extras, cHero, cstrip, miniGantt, gchips, feedCompact, needSlim, tlHero, tlTiles, sumHero});
  // Ссылка рейки показывается, только если в блоках выбранной темы есть её якорь.
  const has = id => page.includes(`id="${id}"`);
  // Версия навыка из состояния (текстом, state недоверенный); нет версии — нет и подписи.
  const skillVer = typeof S.skillVersion === 'string' ? S.skillVersion.slice(0, 16) : '';
  const cur = id => VIEW_HOME[VIEW] === id;
  const navAttr = id => cur(id) ? ' aria-current="page"' : '';
  const navText = (id, label) => cur(id) ? esc(L.views[VIEW]) : label;
  const rail = `<aside class="cockpit-rail" aria-label="${langRu ? 'Навигация' : 'Navigation'}">
    <div class="rail-brand">${BRAND_SVG}
      <span>${BRAND_WORD}<small>CONTROL CENTER${skillVer ? ' / ' + esc(skillVer) : ''}</small></span></div>
    <div class="rail-label">${langRu ? 'Разделы проекта' : 'Project sections'}</div>
    <nav class="rail-nav">
      ${has('mission') ? `<a data-focus-key="nav-mission" href="#mission"${navAttr('mission')}><span class="sym" aria-hidden="true">◉</span>${navText('mission', langRu ? 'Обзор' : 'Overview')}</a>` : ''}
      ${has('tasks') ? `<a data-focus-key="nav-tasks" href="#tasks"${navAttr('tasks')}><span class="sym" aria-hidden="true">▤</span>${navText('tasks', langRu ? 'Задачи' : 'Tickets')}</a>` : ''}
      ${has('models') ? `<a data-focus-key="nav-models" href="#models"${navAttr('models')}><span class="sym" aria-hidden="true">◈</span>${navText('models', langRu ? 'Модели и токены' : 'Models & tokens')}</a>` : ''}
      ${has('quality') ? `<a data-focus-key="nav-quality" href="#quality"${navAttr('quality')}><span class="sym" aria-hidden="true">◇</span>${navText('quality', langRu ? 'Проверки' : 'Quality checks')}</a>` : ''}
    </nav>
    <div class="rail-monitor"><label>${fin ? (langRu ? 'ГОТОВО' : 'COMPLETED') : (langRu ? 'МОНИТОРИНГ' : 'LIVE MONITOR')}</label>
      <b>${esc(nextTitle)}</b>
      <div class="rail-metrics">
        <div><strong>${activeWorkers.length}</strong><small>${langRu ? 'Работают' : 'Active'}</small></div>
        <div><strong>${okGates}/4</strong><small>${langRu ? 'Проверки' : 'Gates passed'}</small></div>
      </div></div>
    <div class="rail-foot">AUTOPILOT ENGINE${skillVer ? ' / ' + esc(skillVer) : ''}</div>
  </aside>`;
  app.innerHTML = `
  <a class="skip-link" data-focus-key="skip" href="#content">${langRu ? 'Перейти к содержимому' : 'Skip to main content'}</a>
  ${rail}
  <main class="cockpit-content" id="content" tabindex="-1">
  <header class="top">
    <div class="brand">${BRAND_MARK}<span class="brand-version" id="brand-version"></span></div>
    ${VIEW !== 'classic' && toMs(S.updatedAt) != null ? `<span class="upd"><i aria-hidden="true"></i>${W.upd} <span data-ago="${esc(S.updatedAt)}">${agoText(S.updatedAt)}</span></span>` : ''}
    <div class="tools">
      ${fin ? '' : `<button type="button" class="iconbtn" data-refresh title="${L.refresh}" aria-label="${L.refresh}">${ic('sync')}</button>`}
      <div class="tabs views" role="group" aria-label="${L.viewLabel}">
        ${VIEW_IDS.map(id => `<button type="button" data-view="${id}" aria-pressed="${VIEW === id}">${esc(L.views[id])}</button>`).join('')}
      </div>
      <div class="tabs" role="group" aria-label="${L.themeLabel}">
        <button type="button" data-theme="light" title="${L.themeLight}" aria-label="${L.themeLight}" aria-pressed="${effectiveTheme()==='light'}">${ic('sun')}</button>
        <button type="button" data-theme="dark" title="${L.themeDark}" aria-label="${L.themeDark}" aria-pressed="${effectiveTheme()==='dark'}">${ic('moon')}</button>
      </div>
      <div class="tabs" role="group" aria-label="${L.langLabel}">
        <button type="button" data-lang="ru" aria-pressed="${L.lang==='ru'}">RU</button>
        <button type="button" data-lang="en" aria-pressed="${L.lang==='en'}">EN</button>
      </div>
    </div>
  </header>
  <div class="title">
    <h1>${esc(S.title)}</h1>
    <div class="meta">${S.mode ? `<span class="tag">${esc(L.modes[S.mode] || S.mode)}</span>` : ''}${
      S.depth ? `<span class="tag">${esc(L.depths[S.depth] || S.depth)}</span>` : ''}<span class="when">${when}</span></div>
  </div>
  ${page}
  <footer>
    <span>${L.filesIn} <code>.autopilot/${esc(S.dir || S.slug)}/</code></span>
    <span>${fin ? L.frozen : `${L.updated}: <span data-ago="${esc(S.updatedAt || '')}"
      title="${S.updatedAt ? esc(new Date(S.updatedAt).toLocaleString(L.lang==='en'?'en-GB':'ru-RU')) : ''}">${S.updatedAt ? agoText(S.updatedAt) : '—'}</span>`}</span>
  </footer>
  </main>`;
  const bv = document.getElementById('brand-version'); // textContent only: state is untrusted
  if (bv) { const v = S.skillVersion; bv.textContent = typeof v === 'string' ? v.slice(0, 16) : ''; bv.hidden = !bv.textContent; }
  if (focusAttr || focusId) {
    const replacement = focusAttr
      ? [...app.querySelectorAll('button, a[href]')].find(node =>
          node.tagName === focusTag && node.getAttribute(focusAttr) === focusValue)
      : document.getElementById(focusId);
    if (replacement) replacement.focus({preventScroll:true});
  }

  // Вкладка подписана проектом: когда репозиторий дорабатывают второй раз, это
  // единственное место, где видно, что на экране прошлый прогон. Пока сборка ждёт
  // человека, вкладка говорит об этом — её видно, даже когда дашборд в фоне.
  document.title = (waiting ? L.tabWait + ' — ' : '') + (S.title ? `${S.title} — autopilot` : 'autopilot');

  if (!booted) {
    booted = true;
    app.classList.add('boot');
    setTimeout(() => app.classList.remove('boot'), 1400);
  }
  tick();
  showLink();
  if (!pulling) pollState();
}

// Один обработчик на всё: #app переписывается целиком на каждом событии сборки.
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.lang) {
    try { localStorage.setItem('autopilot-lang', b.dataset.lang); } catch(err) {}
    render(b.dataset.lang);
  } else if (b.dataset.theme) {
    const t = b.dataset.theme;
    try { localStorage.setItem('autopilot-theme', t); } catch(err) {}
    applyTheme(t);
    document.querySelectorAll('button[data-theme]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.theme === t)));
  } else if (VIEW_IDS.includes(b.dataset.view)) {
    VIEW = b.dataset.view;
    try { localStorage.setItem(VIEW_KEY, VIEW); } catch(err) {}
    render(CUR.lang);
  } else if (b.hasAttribute('data-refresh')) {
    refreshNow(b);
  } else if (b.dataset.filter) {
    UI.filter = b.dataset.filter; UI.open.words = false; render(CUR.lang);
  } else if (b.dataset.more) {
    UI.open[b.dataset.more] = !UI.open[b.dataset.more]; render(CUR.lang);
  }
});

let savedLang = 'ru';
try { savedLang = localStorage.getItem('autopilot-lang')
  || ((navigator.language || '').startsWith('ru') ? 'ru' : 'en'); } catch(e) {}

applyTheme(storedTheme());

// Пустой экран не говорит, что сломалось, поэтому страница объясняет — и не
// сдаётся: опрос продолжается, и когда файл появится, дашборд оживёт сам.
function bootFail(why){
  const app = document.getElementById('app');
  if (!app) return;
  const L = I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'];
  app.innerHTML = `<header class="top"><div class="brand">${BRAND_MARK}<span class="brand-version" id="brand-version"></span></div></header>
    <section class="card"><h3 class="wt">${L.boot}</h3><p class="muted" style="margin-top:10px">${esc(why)}</p>
    <p class="muted" style="margin-top:10px">${L.bootHelp}</p></section>`;
}

if (typeof STATE === 'undefined' || !STATE || typeof STATE !== 'object') {
  bootFail(I18N[(navigator.language || '').startsWith('ru') ? 'ru' : 'en'].bootWhy);
  pollState();
} else {
  try {
    render(I18N[savedLang] ? savedLang : 'ru');
    lastStamp = stampOf(STATE);
  } catch (e) {
    bootFail(String(e && e.message || e));
    pollState();
  }
}

// Секундная стрелка для всех незакрытых интервалов и для «обновлено N назад».
setInterval(tick, 1000);

// Возврат на вкладку — повод не ждать очередного круга опроса.
// После сна компьютера — тоже: таймеры страницы стояли вместе с ним.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); refreshNow(); } });
window.addEventListener('pageshow', e => { if (e.persisted) { tick(); refreshNow(); } });

// Пока пользователь не выбрал тему явно, дашборд следует за системной.
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (storedTheme()) return;
    document.querySelectorAll('button[data-theme]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.theme === effectiveTheme())));
  });
} catch(e) {}
</script>
</body>
</html>
