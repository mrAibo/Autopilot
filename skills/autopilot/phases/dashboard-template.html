<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autopilot</title>
<style>
  /* Цвет здесь — сигнал, а не украшение: у каждого состояния сборки свой.
     Синий — идёт работа, оранжевый — ждём человека или таск пишется,
     зелёный — сдано, бирюзовый — проверка, фиолетовый — ремонт, красный — упало. */
  :root{
    --bg:#F2F2F4; --card:#fff; --inset:#F4F4F6; --soft:#EBEBEE; --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.11);
    --tx:#111113; --tx2:#3A3A3C; --mut:#6B6B70; --quiet:#8E8E93;
    --hero:#2F45E0; --hero-shadow:rgba(40,60,220,.55);
    --done:#17864A; --done-soft:#E2F3E9; --done-tx:#126B3B;
    --now:#FF6B35; --now-on:#1A0D06; --now-soft:#FFE9DF; --now-tx:#AD3D0E;
    --rev:#0B7F8A; --rev-soft:#DDF2F4; --rev-tx:#08666F;
    --fix:#7C3AED; --fix-soft:#EFE7FE; --fix-tx:#6427D0;
    --bad:#DC2626; --bad-soft:#FDE6E6; --bad-tx:#B01C1C;
    --idle:#D4D4D9; --logo-filter:none;
    --sh:0 1px 2px rgba(0,0,0,.04),0 12px 30px -20px rgba(20,24,40,.2);
    --sh-raised:0 1px 2px rgba(0,0,0,.035),0 16px 36px -24px rgba(20,24,40,.24);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme]){
      --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
      --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#A3A3AA; --quiet:#85858C;
      --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
      --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
      --now-soft:#43271C; --now-tx:#FF8A5C;
      --rev:#0E8A96; --rev-soft:#163538; --rev-tx:#6FD6E0;
      --fix:#8B4DF5; --fix-soft:#2F2448; --fix-tx:#BFA2FF;
      --bad:#E5383B; --bad-soft:#47201F; --bad-tx:#FF8B8B;
      --idle:#4A4B51; --logo-filter:invert(1);
      --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
      --sh-raised:0 16px 36px -24px rgba(0,0,0,.8);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181B; --card:#222327; --inset:#2C2D32; --soft:#323338; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --tx:#F2F2F3; --tx2:#C7C7CC; --mut:#A3A3AA; --quiet:#85858C;
    --hero:#2639C2; --hero-shadow:rgba(0,0,0,.7);
    --done:#1E9A56; --done-soft:#1C3527; --done-tx:#5BD68C;
    --now-soft:#43271C; --now-tx:#FF8A5C;
    --rev:#0E8A96; --rev-soft:#163538; --rev-tx:#6FD6E0;
    --fix:#8B4DF5; --fix-soft:#2F2448; --fix-tx:#BFA2FF;
    --bad:#E5383B; --bad-soft:#47201F; --bad-tx:#FF8B8B;
    --idle:#4A4B51; --logo-filter:invert(1);
    --sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -20px rgba(0,0,0,.75);
    --sh-raised:0 16px 36px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;font-synthesis-weight:none}
  ::selection{background:rgba(255,107,53,.25)}
  :focus-visible{outline:2px solid var(--now);outline-offset:3px}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .tnum,.big b,.tv,.s-time,.tl-time,.ev em{font-variant-numeric:tabular-nums}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:24px 26px;min-width:0}
  .ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.xs{width:14px;height:14px;stroke-width:2.6}
  .ic.m{width:20px;height:20px}
  .wt{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3;display:flex;align-items:center;gap:10px}
  .whead{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;margin-bottom:16px;flex-wrap:wrap}
  .whead>span{font-size:14px;color:var(--mut)}

  /* ── верх ─────────────────────────────────────────────────── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:inline-flex;align-items:center;gap:10px;color:var(--tx);white-space:nowrap}
  .brand-name{font-size:25px;font-weight:850;letter-spacing:-.045em;line-height:1.2}
  .brand-version{font-size:11px;font-weight:750;letter-spacing:.07em;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);padding:4px 7px}

  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tabs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-raised)}
  .tabs button,.iconbtn{appearance:none;border:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .tabs button{height:36px;min-width:40px;padding:0 12px;border-radius:999px;background:transparent;color:var(--mut);font-size:13.5px;font-weight:650;transition:background .2s,color .2s}
  .tabs button:hover{color:var(--tx)}
  .tabs button[aria-pressed="true"]{background:var(--tx);color:var(--card)}
  .iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh-raised);color:var(--tx);transition:transform .15s}
  .iconbtn:active{transform:scale(.96)}
  /* «Обновить сейчас»: пока state.js грузится, стрелка крутится — нажатие видно */
  .iconbtn.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .title h1{margin:0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .tag{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-size:13px;font-weight:600;color:var(--tx2)}
  .meta .when{font-size:14px;color:var(--mut);margin-left:4px}
  #link{background:var(--now);color:var(--now-on);border-radius:18px;padding:14px 18px;font-weight:600;font-size:14.5px;line-height:1.45;margin-bottom:0}
  .lost{max-width:1320px;margin:0 auto;padding:16px 32px 0}

  /* ── шапка состояния ─────────────────────────────────────────── */
  .hero{--h-tx:#fff;--h-mut:rgba(255,255,255,.82);--h-track:rgba(255,255,255,.24);
    border-radius:28px;padding:28px 30px 26px;display:flex;flex-direction:column;gap:28px;
    background:var(--hero);color:var(--h-tx);box-shadow:0 30px 60px -32px var(--hero-shadow);min-width:0}
  .hero.ask{background:#FF6B35;--h-tx:#1A0D06;--h-mut:rgba(26,13,6,.74);--h-track:rgba(26,13,6,.16);box-shadow:0 30px 60px -30px rgba(200,70,20,.6)}
  .hero.won{background:#17864A;--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(23,134,74,.6)}
  .hero.bad{background:#C81E1E;--h-track:rgba(255,255,255,.22);box-shadow:0 30px 60px -30px rgba(200,30,30,.55)}
  .hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px}
  .hero-main{flex:1 1 420px;min-width:0}
  .state{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;margin-bottom:12px}
  .hero h2{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;text-wrap:balance;max-width:32ch;overflow-wrap:anywhere}
  .lead{margin:12px 0 0;font-size:16.5px;line-height:1.5;color:var(--h-mut);max-width:64ch}
  .lead b{color:var(--h-tx);font-weight:650}
  .big{text-align:right;flex:0 0 auto}
  .big b{display:block;font-size:58px;line-height:.95;font-weight:700;letter-spacing:-.045em}
  .big b small{font-size:24px;letter-spacing:-.02em;font-weight:600;margin-left:6px}
  .big>span{display:block;font-size:14px;color:var(--h-mut);margin-top:10px}
  .big .paused{display:block;margin-top:6px;font-weight:650;color:var(--h-tx)}
  .hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;padding:8px 18px;border-radius:22px;background:#1A0D06;color:#fff;font-size:15px;font-weight:600;line-height:1.35}
  .track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
  .seg{height:12px;border-radius:4px;background:var(--h-track);overflow:hidden}
  .seg i{display:block;height:100%;border-radius:4px}
  .s-done .seg i{width:100%;background:#21A35B}
  .hero.won .s-done .seg i,.hero.bad .s-done .seg i{background:#fff}
  .hero.ask .s-done .seg i{background:#1A0D06}
  .s-now .seg i{background-color:var(--now)}
  .hero.ask .s-now .seg i{background-color:#fff}
  .s-fail .seg i{width:100%;background:#fff}
  .s-skip .seg{background:repeating-linear-gradient(135deg,var(--h-track) 0 4px,transparent 4px 8px)}
  .s-name{display:block;margin-top:10px;font-size:13px;font-weight:600;line-height:1.3}
  .s-now .s-name,.s-fail .s-name{font-weight:750}
  .s-pend .s-name,.s-skip .s-name{color:var(--h-mut);font-weight:500}
  .s-time{display:block;margin-top:2px;font-size:12.5px;color:var(--h-mut)}
  .live{width:9px;height:9px;border-radius:50%;background:var(--now);outline:2px solid rgba(255,255,255,.9);display:inline-block;flex:0 0 auto;animation:pulse 1.8s cubic-bezier(.16,1,.3,1) infinite}
  .hero.ask .live{background:#1A0D06;outline:0}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,53,.6)}70%{box-shadow:0 0 0 9px rgba(255,107,53,0)}100%{box-shadow:0 0 0 0 rgba(255,107,53,0)}}
  .badge-ic{width:26px;height:26px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
  .hero.won .badge-ic{color:#17864A}.hero.bad .badge-ic{color:#C81E1E}
  .stripes{background-image:linear-gradient(135deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%,transparent);background-size:22px 22px;animation:stripes 1.1s linear infinite}
  .hero.ask .stripes{background-image:linear-gradient(135deg,rgba(255,107,53,.5) 25%,transparent 25%,transparent 50%,rgba(255,107,53,.5) 50%,rgba(255,107,53,.5) 75%,transparent 75%,transparent)}
  @keyframes stripes{to{background-position:22px 0}}

  /* ── плитки ───────────────────────────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .tile{display:flex;flex-direction:column;gap:11px;padding:20px 22px}
  .tk{font-size:13.5px;font-weight:600;color:var(--mut)}
  .tv{font-size:38px;line-height:1;font-weight:700;letter-spacing:-.04em}
  .tv small{font-size:17px;font-weight:600;color:var(--mut);letter-spacing:-.01em;margin-left:4px}
  .tv.dim{color:var(--quiet)}
  .ts{font-size:13px;color:var(--mut);line-height:1.4}
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--inset)}
  .stack i{display:block;height:100%}
  .sq{display:flex;gap:5px;flex-wrap:wrap}
  .sq i{width:18px;height:18px;border-radius:5px;display:block}
  .okb{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;align-self:flex-start;color:#fff}

  /* ── цвета статусов ───────────────────────────────────────── */
  .f-done{background:var(--done);color:#fff}
  .f-now{background-color:var(--now);color:var(--now-on)}
  .f-rev{background:var(--rev);color:#fff}
  .f-fix{background:var(--fix);color:#fff}
  .f-bad{background:var(--bad);color:#fff}
  .f-wait{background:transparent;color:var(--mut);border:1.5px dashed var(--idle)}
  .f-idle{background:var(--idle)}
  .f-q{background:var(--quiet)}

  /* ── ход сборки ───────────────────────────────────────────── */
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .lg{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:999px;background:var(--inset);font-size:13px;font-weight:600;color:var(--tx2)}
  .lg i{width:11px;height:11px;border-radius:3px;display:block}
  .lg b{font-weight:750;color:var(--tx)}
  .wave{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--quiet);margin:18px 0 8px}
  .whead+.wave{margin-top:4px}
  .wave span{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
  .tl{display:grid;grid-template-columns:32px minmax(0,1fr) 64px;gap:4px 12px;align-items:center;margin-bottom:7px}
  .tl-id{font-size:14.5px;font-weight:750;color:var(--quiet)}
  .tl-id.on{color:var(--tx)}
  .bar{height:42px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px 0 15px;font-size:14.5px;font-weight:650;min-width:0}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .chipin{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:12.5px;font-weight:700;white-space:nowrap}
  .f-now .chipin{background:rgba(26,13,6,.12)}
  .f-wait .chipin{background:var(--inset);color:var(--mut)}
  .tl-time{font-size:13.5px;font-weight:650;text-align:right;color:var(--mut);white-space:nowrap}
  .tl-time.now{color:var(--now-tx)}.tl-time.fix{color:var(--fix-tx)}.tl-time.rev{color:var(--rev-tx)}.tl-time.bad{color:var(--bad-tx)}
  .tl-note{grid-column:2/4;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.45;padding:1px 2px 6px;overflow-wrap:anywhere}
  .tl-note.fix{color:var(--fix-tx)}.tl-note.rev{color:var(--rev-tx)}.tl-note.bad{color:var(--bad-tx)}
  .tl-note .ic{margin-top:2px}

  /* ── колонки и списки ─────────────────────────────────────── */
  .cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:20px;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{appearance:none;height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--soft);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip i{width:9px;height:9px;border-radius:3px;display:block}
  .chip span{color:var(--mut);font-weight:500}
  .chip[aria-pressed="true"]{background:var(--tx);color:var(--card)}
  .chip[aria-pressed="true"] span{color:inherit;opacity:.7}
  .req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .req p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
  .rid{display:inline-block;min-width:40px;font-size:12px;color:var(--quiet);font-weight:750}
  .why{display:block;font-size:13px;color:var(--mut);margin-top:3px;padding-left:40px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .p-done{background:var(--done-soft);color:var(--done-tx)}
  .p-now{background:var(--now-soft);color:var(--now-tx)}
  .p-mut{background:var(--inset);color:var(--mut)}
  .p-bad{background:var(--bad-soft);color:var(--bad-tx)}
  .more{margin-top:2px;padding-top:12px;border-top:1px solid var(--line)}
  .btn-soft{appearance:none;height:38px;padding:0 15px;border-radius:999px;border:0;background:var(--soft);color:var(--tx);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .gate{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
  .whead+.gate{border-top:0;padding-top:0}
  .gi{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .gi.ok{background:var(--done);color:#fff}
  .gi.wait{color:var(--quiet);border:1.5px dashed var(--idle)}
  .gi.warn{background:var(--now);color:var(--now-on)}
  .gi.bad{background:var(--bad);color:#fff}
  .gt{font-size:15px;font-weight:650;line-height:1.35}
  .gs{font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
  .gk{font-size:12px;font-weight:750;color:var(--quiet);padding-top:3px}
  .ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:start;padding:9px 0;font-size:14px;line-height:1.45;border-top:1px solid var(--line)}
  .whead+.ev{border-top:0;padding-top:0}
  .ei{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--inset);color:var(--mut)}
  .ev>span{padding-top:2px;overflow-wrap:anywhere}
  .ev em{font-style:normal;font-size:12.5px;color:var(--quiet);white-space:nowrap;padding-top:3px}
  .need{padding:13px 0;border-top:1px solid var(--line)}
  .whead+.need{border-top:0;padding-top:0}
  .nh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;font-weight:650}
  .nh span{font-size:14px;font-weight:600;color:var(--mut)}
  .keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .key{font-size:12.5px;padding:5px 9px;border-radius:9px;background:var(--inset);color:var(--tx2);overflow-wrap:anywhere}
  .nl{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--tx2);line-height:1.45}
  .nl li{overflow-wrap:anywhere}
  .nl li+li{margin-top:7px}
  .nl.n0{margin-top:0}
  .nl+.btn-soft{margin-top:12px}
  .prep{border:2px solid var(--now)}
  .prep .wt i{width:28px;height:28px;border-radius:8px;background:var(--now);color:var(--now-on);display:inline-flex;align-items:center;justify-content:center}
  .blind-top{display:flex;align-items:center;gap:18px;margin-bottom:6px;flex-wrap:wrap}
  .blind-top b{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .blind-top b small{font-size:17px;color:var(--mut);font-weight:600;margin-left:4px}
  .blind-top p{margin:0;flex:1 1 260px;font-size:14px;line-height:1.5;color:var(--mut)}
  .empty{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;border:1.5px dashed var(--idle);font-size:14.5px;line-height:1.5;color:var(--tx2)}
  .empty .ic{color:var(--mut);margin-top:3px}
  .muted{color:var(--mut);font-size:14px;line-height:1.5;margin:0}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px;font-size:13px;color:var(--mut);padding:2px 4px 0}
  footer code{font-size:12.5px;color:var(--tx2);overflow-wrap:anywhere}
  .stale{color:var(--now-tx);font-weight:650}

  /* Появление — один раз, при первой отрисовке: страница перерисовывается
     на каждом событии сборки, и анимация на каждом круге мигала бы. */
  .boot .w{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
  .boot .w:nth-child(2){animation-delay:.05s}.boot .w:nth-child(3){animation-delay:.1s}

  /* Dashboard 3.0: editorial, low-noise cockpit with explicit next action. */

    --sh:0 1px 2px rgba(20,38,73,.025),0 10px 32px -24px rgba(22,42,78,.28);

      --tx:#F0F5FE; --tx2:#CBDAF1; --mut:#9FAFC8; --quiet:#8093AE;
      --hero:#244579; --hero-shadow:rgba(0,0,0,.55);
      --sh:0 14px 35px -20px rgba(0,0,0,.5);

  .card{border-radius:20px;padding:22px 24px}

  .trackcard .s-fail .seg i{background:var(--bad)}
  .trackcard .s-done .seg i{background:var(--done)}
  .trackcard .s-now .seg i{background-color:var(--now)}
  .tablewrap{overflow-x:auto}
  .routes{width:100%;border-collapse:collapse;font-size:13.5px}
  .routes th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:750;padding:0 12px 10px 0}
  .routes td{padding:11px 12px 11px 0;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
  .flat{margin-top:0;padding-top:0;border-top:0}
  @media(max-width:900px){
    .tools{flex:1 1 100%}
    .views{flex:1 1 100%}
    .wordmark{font-size:19px}
    .brandmark{width:28px;height:28px}
  }

  /* Dashboard 3.3: палитра макетов. Рубильник — атрибут data-view на корне (его ставит render()):
     «Классика» атрибута-исключения не получает и остаётся в прежних цветах. */
  :root[data-view]:not([data-view="classic"]){
    --bg:#EDF4F0; --card:#FFFFFF; --line:#D6E4DC; --line2:#C3D6CB;
    --tx:#0F2A22; --tx2:#3F5A50; --mut:#5A7268; --quiet:#5A7268;
    --done:#0A7D5A; --done-soft:#DDF3EA; --done-tx:#075E44; --on-done:#FFFFFF;
    --now:#E8742A; --now-soft:#FDEBDD; --now-tx:#A8470F; --now-on:#2A1405; --hatch:#F6A56B;
    --rev:#1B6FB8; --rev-soft:#E1EFFB; --rev-tx:#145A96; --on-rev:#FFFFFF;
    --warn-bg:#FDF1E6; --warn-bd:#F0C9A6; --warn-tx:#7A3A0C;
    --bad:#B42318; --bad-tx:#B42318; --bad-soft:#FDECEA; --on-bad:#FFFFFF;
    --inset:#F3F8F5; --soft:#E3EDE7; --idle:#8FA89C; --accent:#0A7D5A;
    --sh:0 1px 2px rgba(15,42,34,.05); --sh-raised:none;
  }
  :root[data-theme="dark"][data-view]:not([data-view="classic"]){
    --bg:#0B1220; --card:#121B2E; --line:#22304D; --line2:#2E3F63;
    --tx:#E8EEF8; --tx2:#C5D2E8; --mut:#9FB0CC; --quiet:#9FB0CC;
    --done:#34D399; --done-soft:#0F3D31; --done-tx:#6EE7B7; --on-done:#052E22;
    --now:#FB923C; --now-soft:#4A2508; --now-tx:#FDBA74; --now-on:#1A0D06; --hatch:#D9742A;
    --rev:#60A5FA; --rev-soft:#12294A; --rev-tx:#93C5FD; --on-rev:#0B1B33;
    --warn-bg:#2A1A0B; --warn-bd:#6B4A12; --warn-tx:#FCD34D;
    --bad:#F97066; --bad-tx:#F97066; --bad-soft:#3A1512; --on-bad:#3A1512;
    --inset:#18243D; --soft:#1F2D4A; --idle:#566A8F; --accent:#34D399;
    --sh:none; --sh-raised:none;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme])[data-view]:not([data-view="classic"]){
      --bg:#0B1220; --card:#121B2E; --line:#22304D; --line2:#2E3F63;
      --tx:#E8EEF8; --tx2:#C5D2E8; --mut:#9FB0CC; --quiet:#9FB0CC;
      --done:#34D399; --done-soft:#0F3D31; --done-tx:#6EE7B7; --on-done:#052E22;
      --now:#FB923C; --now-soft:#4A2508; --now-tx:#FDBA74; --now-on:#1A0D06; --hatch:#D9742A;
      --rev:#60A5FA; --rev-soft:#12294A; --rev-tx:#93C5FD; --on-rev:#0B1B33;
      --warn-bg:#2A1A0B; --warn-bd:#6B4A12; --warn-tx:#FCD34D;
      --bad:#F97066; --bad-tx:#F97066; --bad-soft:#3A1512; --on-bad:#3A1512;
      --inset:#18243D; --soft:#1F2D4A; --idle:#566A8F; --accent:#34D399;
      --sh:none; --sh-raised:none;
    }
  }
  /* Общие блоки в новой палитре — только вне «Классики». */
  html:not([data-view="classic"]) :focus-visible{outline-color:var(--tx)}
  html:not([data-view="classic"]) .card{border-radius:22px;box-shadow:var(--sh)}
  html:not([data-view="classic"]) .title:before{color:var(--done-tx)}
  html:not([data-view="classic"]) .brand-version{background:var(--done-soft);color:var(--done-tx)}
  html:not([data-view="classic"]) .f-done,html:not([data-view="classic"]) .gi.ok{color:var(--on-done)}
  html:not([data-view="classic"]) .f-rev{color:var(--on-rev)}
  html:not([data-view="classic"]) .f-bad,html:not([data-view="classic"]) .gi.bad{color:var(--on-bad)}
  html:not([data-view="classic"]) .tabs{border-color:var(--line);box-shadow:none}
  html:not([data-view="classic"]) .tabs button,html:not([data-view="classic"]) .iconbtn{min-height:44px;min-width:44px}
  html:not([data-view="classic"]) .iconbtn{width:44px;height:44px;box-shadow:none}
  /* Шапка состояния у «Итога»: карточка в палитре вместо синего градиента. */
  html:not([data-view="classic"]) .hero{--h-tx:var(--tx);--h-mut:var(--tx2);--h-track:var(--soft);
    background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:var(--sh)}
  html:not([data-view="classic"]) .hero:before{display:none}
  html:not([data-view="classic"]) .hero.ask{background:var(--warn-bg);border-color:var(--warn-bd);--h-tx:var(--warn-tx);--h-mut:var(--warn-tx)}
  html:not([data-view="classic"]) .hero.won{background:var(--done-soft);--h-tx:var(--done-tx);--h-mut:var(--done-tx)}
  html:not([data-view="classic"]) .hero.bad{background:var(--bad-soft);--h-tx:var(--bad-tx);--h-mut:var(--bad-tx)}
  html:not([data-view="classic"]) .hero .s-done .seg i,html:not([data-view="classic"]) .hero.won .s-done .seg i,
  html:not([data-view="classic"]) .hero.bad .s-done .seg i,html:not([data-view="classic"]) .hero.ask .s-done .seg i{background:var(--done)}
  html:not([data-view="classic"]) .hero .s-now .seg i,html:not([data-view="classic"]) .hero.ask .s-now .seg i{background-color:var(--now)}
  html:not([data-view="classic"]) .hero .s-fail .seg i{background:var(--bad)}
  html:not([data-view="classic"]) .hero .live{outline-color:var(--card)}
  .p-rev{background:var(--rev-soft);color:var(--rev-tx)}

  /* Переключатель видов: цель нажатия не меньше 44 px, «нажато» — ещё и галочкой, не только цветом. */
  .views button{min-height:44px;height:44px}
  .views button[aria-pressed="true"]::before{content:"✓";margin-right:6px}

  /* «Обзор» */
  .ovh{display:flex;flex-wrap:wrap;align-items:center;gap:28px 36px;padding:32px 34px;border-radius:28px}
  .ring{--rs:210px;width:var(--rs);height:var(--rs);border-radius:50%;flex:none;display:grid;place-items:center}
  .ring-in{width:76%;height:76%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:6px}
  .ring-in b{font-size:calc(var(--rs) * .21);font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring-in b small{font-size:.55em;font-weight:600;color:var(--mut)}
  .ring-in span{font-size:13px;color:var(--tx2);margin-top:6px;max-width:12ch;line-height:1.25}
  .ring.sm{--rs:116px}
  .ring.sm .ring-in span{font-size:11px;margin-top:3px}
  .ovh-main{flex:1 1 400px;min-width:0}
  .chip-state{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;
    background:var(--now-soft);color:var(--now-tx)}
  .chip-state i{width:8px;height:8px;border-radius:50%;background:var(--now);flex:none}
  .ask .chip-state{background:var(--warn-bg);color:var(--warn-tx);box-shadow:inset 0 0 0 1px var(--warn-bd)}
  .won .chip-state{background:var(--done-soft);color:var(--done-tx)}
  .won .chip-state i{background:var(--done)}
  .bad .chip-state{background:var(--bad-soft);color:var(--bad-tx)}
  .bad .chip-state i{background:var(--bad)}
  .ovh h2{margin:14px 0 10px;font-size:clamp(26px,3vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.02em;
    text-wrap:balance;overflow-wrap:anywhere}
  .ovh .lead{margin:0;font-size:17px;line-height:1.5;color:var(--tx2);max-width:64ch}
  .ovh .hint{background:var(--warn-bg);color:var(--warn-tx);box-shadow:inset 0 0 0 1px var(--warn-bd)}
  .evnote{margin-top:16px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--tx2);
    background:var(--inset);border-radius:14px;padding:12px 14px;max-width:660px}
  .evnote .mono{color:var(--tx);font-weight:500;flex:none}
  .ovh-side{flex:0 1 290px;min-width:240px;display:flex;flex-direction:column;gap:14px}
  .fc{display:flex;flex-direction:column;gap:2px}
  .fc-k{font:11px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .fc-v{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
  .fc-s{font-size:13px;color:var(--tx2)}
  .kvs{display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
  .kv{display:flex;justify-content:space-between;gap:12px}
  .kv span{color:var(--tx2)}
  .kv b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

  .route{list-style:none;margin:0;padding:22px 28px 20px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
    background:var(--card);border:1px solid var(--line);border-radius:22px}
  .rs{min-width:0;padding-right:6px}
  .rs-top{display:flex;align-items:center;min-height:28px}
  .rs-mark{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center}
  .rs-line{flex:1;height:3px}
  .rs.done .rs-mark{background:var(--done);color:var(--on-done)}
  .rs.done .rs-line{background:var(--done)}
  .rs.now .rs-mark{width:28px;height:28px;background:var(--now-soft);border:3px solid var(--now)}
  .rs.now .rs-mark i{width:8px;height:8px;border-radius:50%;background:var(--now);display:block}
  .rs.now .rs-line{background:repeating-linear-gradient(90deg,var(--now) 0 8px,var(--now-soft) 8px 14px)}
  .rs.pend .rs-mark,.rs.skip .rs-mark{border:2px dashed var(--idle);color:var(--mut)}
  .rs.pend .rs-line,.rs.skip .rs-line{background:var(--line)}
  .rs.bad .rs-mark{background:var(--bad);color:var(--on-bad)}
  .rs.bad .rs-line{background:var(--bad)}
  .rs:last-child .rs-line{display:none}
  .rs-name{display:block;margin-top:6px;font-size:13px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
  .rs.now .rs-name{font-weight:800;color:var(--now-tx)}
  .rs.pend .rs-name,.rs.skip .rs-name{color:var(--mut)}
  .rs-sub{display:block;font:12px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);overflow-wrap:anywhere}
  .rs.now .rs-sub{color:var(--now-tx)}

  /* Диаграмма Ганта */
  .gx{--cols:260px minmax(0,1fr) 150px;position:relative}
  .gx-axis,.gx-row{display:grid;grid-template-columns:var(--cols);column-gap:12px}
  .gx-axis{height:40px;border-bottom:1px solid var(--line)}
  .gx-ticks{position:relative}
  .gx-ticks span{position:absolute;bottom:6px;transform:translateX(-50%);font:11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);white-space:nowrap}
  .gx-ticks .gx-nowtag{bottom:auto;top:0;background:var(--now-tx);color:var(--card);border-radius:5px;padding:3px 7px;font-weight:700;z-index:3}
  .gx-row{min-height:60px;align-items:center;border-bottom:1px solid var(--line)}
  .gx-lab{display:flex;gap:12px;align-items:center;min-width:0}
  .gx-lab>div{min-width:0}
  .gx-lab b{display:block;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
  .gx-lab small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
  .gx-id{font:13px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);width:24px;flex:none}
  .gx-lane{position:relative;height:36px}
  .gx-grid{position:absolute;top:-12px;bottom:-12px;width:1px;background:var(--line)}
  .gx-nowline{position:absolute;top:-12px;bottom:-12px;width:2px;margin-left:-1px;background:var(--now-tx);z-index:2}
  .gx-bar,.gx-tail{position:absolute;top:4px;height:28px;border-radius:8px;display:flex;align-items:center;gap:6px;
    padding:0 9px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;z-index:1}
  .gx-done{background:var(--done);color:var(--on-done)}
  .gx-now{background:repeating-linear-gradient(135deg,var(--now) 0 4px,var(--hatch) 4px 8px);color:var(--now-on)}
  .gx-rev,.gx-fix{background:var(--rev-soft);color:var(--rev-tx);box-shadow:inset 0 0 0 2px var(--rev)}
  .gx-bad{background:var(--bad);color:var(--on-bad)}
  .gx-wait{box-shadow:inset 0 0 0 1.5px var(--idle);color:var(--tx2);background:var(--card);
    background-image:repeating-linear-gradient(90deg,var(--card) 0 5px,transparent 5px 9px)}
  .gx-tail{border:1.5px dashed var(--now);color:var(--now-tx);font-weight:600;font-size:12px}
  .gx-none{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);white-space:nowrap}
  .gx-mdl{min-width:0}
  .gx-note{grid-column:1/-1;padding:0 2px 10px 36px;align-items:center;flex-wrap:wrap}
  .gx-note>span{flex:1 1 220px;min-width:0}
  .gx-note .gx-redo{color:var(--mut);white-space:nowrap}
  .gx-note .btn-soft{height:28px;padding:0 10px;font-size:12.5px;flex:none}
  .mchip{display:inline-block;font:11.5px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;border:1px solid var(--line2);
    border-radius:7px;padding:2px 8px;background:var(--inset);color:var(--tx2);overflow-wrap:anywhere}
  .gx-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--tx2);justify-content:flex-end;max-width:520px}
  .gx-legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:18px;height:11px;border-radius:3px;display:inline-block}
  .sw-done{background:var(--done)}
  .sw-now{background:repeating-linear-gradient(135deg,var(--now) 0 4px,var(--hatch) 4px 8px)}
  .sw-rev{background:var(--rev-soft);box-shadow:inset 0 0 0 2px var(--rev)}
  .sw-wait{border:1.5px dashed var(--idle)}
  .gx.mini{--cols:minmax(0,1fr)}
  .gx.mini .gx-pad,.gx.mini .gx-mdl{display:none}
  .gx.mini .gx-row{min-height:0;padding:10px 0;row-gap:6px}
  .gx.mini .gx-lab b{flex:1}
  .gx.mini .gx-grid,.gx.mini .gx-nowline{top:0;bottom:0}
  .gx.mini .gx-lane{height:30px;background:var(--inset);border-radius:8px}
  .gx.mini .gx-bar,.gx.mini .gx-tail{top:3px;height:24px;font-size:12px;padding:0 6px}
  .gx.mini+.gx-legend{justify-content:flex-start;margin-top:12px}

  .ov3{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:start;scroll-margin-top:18px}
  .ov3>.col:empty{display:none}
  .ask-card>.card{background:var(--warn-bg);border-color:var(--warn-bd)}
  .ask-card .wt,.ask-card .nh,.ask-card .nh span{color:var(--warn-tx)}
  .ask-card .key{background:var(--card);border:1px solid var(--warn-bd)}

  /* «Компактный» */
  .cmp{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
  .cmp-hero{padding:20px}
  .cmp-top{display:flex;align-items:center;gap:18px}
  .cmp-side{min-width:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .cmp-hero .fc-v{font-size:34px}
  .cmp-hero h2{margin:16px 0 0;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
  .cmp-hero .evnote{margin-top:14px;font-size:13px}
  .ctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
  .ctile{background:var(--inset);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .ctile span{font-size:12px;color:var(--mut)}
  .ctile b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .cs-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;font-size:15px}
  .cs-sub{font:12px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--now-tx)}
  .cs-bar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;margin:12px 0 10px}
  .cs-bar i{height:10px;border-radius:4px;background:var(--soft)}
  .cs-bar i.done{background:var(--done)}
  .cs-bar i.now{background:repeating-linear-gradient(135deg,var(--now) 0 4px,var(--hatch) 4px 8px)}
  .cs-bar i.bad{background:var(--bad)}
  .cs-bar i.pend,.cs-bar i.skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle)}
  .gchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .gchip{padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.3;background:var(--done-soft);color:var(--done-tx);overflow-wrap:anywhere}
  .gchip.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle);color:var(--tx2)}
  .gchip.warn{background:var(--warn-bg);color:var(--warn-tx);box-shadow:inset 0 0 0 1px var(--warn-bd)}

  @media(max-width:1180px){.ov3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ov3>.col:last-child{grid-column:1/-1}}
  @media(max-width:900px){
    .ovh{padding:22px 20px;gap:20px}
    .ring{--rs:170px}
    .ovh-side{flex:1 1 100%}
    .route{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 0;padding:18px 16px}
    .gx{--cols:minmax(0,1fr)}
    .gx-pad,.gx-mdl{display:none}
    .gx-row{min-height:0;padding:10px 0;row-gap:6px}
    .gx-lane{background:var(--inset);border-radius:8px}
    .gx-grid,.gx-nowline{top:0;bottom:0}
  }
  @media(max-width:760px){.ov3{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:560px){.route{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:520px){.ctile b{font-size:15px}.cmp-hero{padding:16px}}
  @media(max-width:360px){.ctiles{grid-template-columns:repeat(2,minmax(0,1fr))}.gchips{grid-template-columns:minmax(0,1fr)}}

  /* «Требования»: матрица пути фразы по семи этапам. Состояние — значок и слово, цвет только помогает. */
  .mx-head,.mx-row,.mx-sum{display:grid;grid-template-columns:minmax(200px,1.8fr) repeat(7,minmax(0,1fr));column-gap:6px;align-items:center}
  .mx-head{padding:0 0 10px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;text-align:center;line-height:1.25}
  .mx-head span:first-child{text-align:left;font:11px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .mx-row{padding:14px 0;border-bottom:1px solid var(--line)}
  .mx-req{display:flex;gap:10px;align-items:flex-start;min-width:0;padding-right:10px}
  .mx-req>div{min-width:0}
  .mx-req p{margin:0;font-size:14px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
  .mx-req small{display:block;font:12px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--mut);margin-top:3px}
  .mx-req small:empty{display:none}
  .mx-c{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
  .mx-h{display:none;font-size:10px;font-weight:700;line-height:1.2;color:var(--mut);overflow-wrap:anywhere}
  .mx-m{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--idle);color:var(--mut)}
  .mx-c.done .mx-m{background:var(--done);border-color:var(--done);color:var(--on-done)}
  .mx-c.now .mx-m{background:var(--now-soft);border:3px solid var(--now)}
  .mx-c.now .mx-m i{width:8px;height:8px;border-radius:50%;background:var(--now);display:block}

     показывает данные, чем бы его ни открыли — двойным кликом, панелью через

      sVerdict:"Your words: a verdict on each requirement",sVerdictSub:"Only you can strike a requirement out. Here you see where it lives in the project and who checked it.",
      cWhere:"Where",cTests:"Tests",cReview:"Review",cBlind:"Blind acceptance",
      rvOk:"passed",rvFix:n=>`${n} fixed`,rvOn:"in review",rvWait:"waiting",bOk:"passed",bBad:"differs",bWait:"at the end",
      sMis:id=>`Mismatch on ${id}: acceptance and tracker disagree`,sMisAny:"Mismatch: acceptance and tracker disagree",
      sNext:"What to do next",sNeed:"Needed from you",
      nEnv:n=>`Fill in ${n} ${en(n,'value','values')} in .env`,nEnvD:"the variable names are below; the values are only yours",
      nPh:n=>`Replace ${n} ${en(n,'placeholder','placeholders')}`,nPhD:"visible stubs the agent did not invent for you",
      nMis:id=>`Decide on ${id}`,nMisD:"fix it now or accept it as it is",
      nAsm:n=>`Look through the decisions made for you: ${n}`,nAsmD:"any of them can be overruled",
      upd:"updated",notCreated:"not created"}}
};

let CUR = I18N.ru;                 // язык, на котором сейчас отрисовано — нужен тикающим таймерам
// Выключателя автообновления больше нет: стрелку нажимали как «обновить», а она
// молча выключала опрос — и запоминала это, так что дашборд замирал навсегда.
try { localStorage.removeItem('autopilot-auto'); } catch(e) {}
let pollT = null;
let pulling = false;
let misses = 0;                    // неудачных подгрузок state.js подряд
let lastStamp = null;              // метка отрисованного состояния — против лишних перерисовок
let booted = false;
// Что пользователь раскрыл и отфильтровал — переживает перерисовку на каждом событии.
const UI = {filter: 'all', open: {}};

// ——— живые таймеры ———————————————————————————————————————————————
// Всё время считается из меток state.js. Незакрытый интервал тикает от текущего момента.
const toMs = v => { const t = v ? new Date(v).getTime() : NaN; return isNaN(t) ? null : t; };
const spanMs = (from, to) => {
  const a = toMs(from);
  if (a == null) return null;
  const b = to ? toMs(to) : Date.now();
  return Math.max(0, (b == null ? Date.now() : b) - a);
};
// ——— активное время ——————————————————————————————————————————————
// Часы прогона показывают работу, а не календарь: ушёл человек на сутки — часы стоят.
// Промежуток между соседними метками длиннее порога — это простой, а не работа.
// Порог — сорок пять минут: на реальных прогонах работа между метками укладывается
// в час, а простои идут часами и сутками (444 минуты, 4207, 7814).
// Ожидание ответа пользователя (waits, waiting) вычитается целиком: это время
// человека, а не сборки, и на дашборде оно идёт отдельным счётчиком.
let MARKS = [];
let WAITS = [];
// `updatedAt` перезаписывается, поэтому страница помнит и то, что видела сама —
// для прогонов, начатых до журнала beats. Хранится по прогону, переживает перезагрузку.
function rememberBeats(S){
  const key = 'autopilot-beats:' + (S.slug || '') + ':' + (S.startedAt || '');
  try {
    const seen = JSON.parse(localStorage.getItem(key) || '[]');
    if (S.updatedAt && seen.indexOf(S.updatedAt) === -1) {
      seen.push(S.updatedAt);
      localStorage.setItem(key, JSON.stringify(seen.slice(-600)));
    }
    return seen;
  } catch (e) { return []; }
}
function collectMarks(S){
  const out = [];
  const push = v => { const t = toMs(v); if (t != null) out.push(t); };
  push(S.startedAt); push(S.updatedAt); push(S.finishedAt);
  (S.beats || []).forEach(push);
  rememberBeats(S).forEach(push);
  (S.stages || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.tickets || []).forEach(x => { push(x.startedAt); push(x.finishedAt); });
  (S.waits || []).forEach(x => { push(x.from); push(x.to); });
  return Array.from(new Set(out)).sort((a, b) => a - b);
}
function collectWaits(S){
  const out = [];
  (S.waits || []).forEach(w => {
    const a = toMs(w.from), b = toMs(w.to);
    if (a != null && b != null && b > a) out.push([a, b]);
  });
  if (S.waiting && !S.finishedAt) {
    const a = toMs(S.waiting.since);
    if (a != null) out.push([a, null]);
  }
  return out;
}
function waitedIn(a, b){
  let s = 0;
  WAITS.forEach(([x, y]) => {
    const hi = Math.min(b, y == null ? Date.now() : y), lo = Math.max(a, x);
    if (hi > lo) s += hi - lo;
  });
  return s;
}
// Сумма промежутков между метками без ожидания пользователя; каждый обрезан по порогу простоя.
function activeMs(from, to){
  const a = toMs(from);
  if (a == null) return null;
  const b = (to && toMs(to)) || Date.now();
  if (b <= a) return 0;
  const pts = [a].concat(MARKS.filter(t => t > a && t < b), [b]);
  let s = 0;
  for (let i = 1; i < pts.length; i++) {
    const gap = pts[i] - pts[i-1] - waitedIn(pts[i-1], pts[i]);
    s += Math.min(Math.max(0, gap), IDLE_CAP_MS);
  }
  return s;
}
// Стоят ли часы прямо сейчас — то есть тянется ли простой дольше порога.
// Ожидание ответа — не простой: у него своя подпись.
function idleNow(){
  const S = window.STATE || {};
  if (!S || S.finishedAt || S.waiting) return false;
  const last = MARKS.length ? MARKS[MARKS.length - 1] : null;
  return last != null && Date.now() - last > IDLE_CAP_MS;
}
const fmtClock = ms => {
  if (ms == null) return '—';
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${m}:${p(ss)}`;
};
const fmtDur = m => m == null ? '—'
  : m < 60 ? m + ' ' + CUR.min : Math.floor(m/60) + ' ' + CUR.hr + ' ' + String(m%60).padStart(2,'0') + ' ' + CUR.min;
const hhmm = iso => { const t = toMs(iso); if (t == null) return ''; const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
// Открытый интервал получает data-live — его каждую секунду обновляет tick().
function timerHTML(from, to){
  const ms = activeMs(from, to);
  if (ms == null) return '—';
  return to ? fmtClock(ms) : `<span data-live data-from="${esc(from)}">${fmtClock(ms)}</span>`;
}
function agoText(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '—';
  const s = Math.floor(ms/1000);
  if (s < 60) return CUR.ago.s(s);
  const m = Math.floor(s/60);
  return m < 60 ? CUR.ago.m(m) : CUR.ago.h(Math.floor(m/60), m%60);
}
function agoShort(iso){
  const ms = spanMs(iso, null);
  if (ms == null) return '';
  const m = Math.floor(ms/60000);
  return m < 1 ? CUR.agoShort.s : m < 60 ? CUR.agoShort.m(m) : CUR.agoShort.h(Math.floor(m/60));
}
function tick(){
  const stopped = idleNow();
  document.querySelectorAll('[data-live][data-from]').forEach(el => {
    el.textContent = fmtClock(activeMs(el.dataset.from, null));
  });
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmtClock(spanMs(el.dataset.since, null));
  });
  document.querySelectorAll('[data-idle-note]').forEach(el => { el.hidden = !stopped; });
  document.querySelectorAll('[data-ago]').forEach(el => {
    el.textContent = agoText(el.dataset.ago);
    // Молчание — повод присмотреться, но только когда никто не работает.
    // Пока таск идёт, записей внутри него нет по устройству процесса:
    // порог тогда — не пять минут, а заметно дольше самого долгого таска.
    const S = window.STATE || {};
    const busy = (S.tickets || []).some(t =>
      t.status === 'in-progress' || t.status === 'review' || t.status === 'repair');
    el.classList.toggle('stale', !S.finishedAt && !S.waiting
      && spanMs(el.dataset.ago, null) > (busy ? 2700000 : 300000));
  });
  document.querySelectorAll('[data-ago-short]').forEach(el => {
    el.textContent = agoShort(el.dataset.agoShort);
  });
}

// ——— автообновление ——————————————————————————————————————————————
// Страница не перезагружается: она подтягивает state.js заново отдельным тегом.
// Встроенные панели (Claude Desktop, IDE-вьюверы) глушат навигацию — и
// location.reload(), и <meta http-equiv="refresh"> там молча ничего не делают,
// а загрузку подресурсов панель не трогает. Проверено измерением: reload и meta
// refresh не сработали ни разу, подгрузка тега — двенадцать раз из двенадцати.
// Но подресурсы живут только у страницы, у которой есть адрес. Панель Claude не
// открывает file:// как страницу — она вклеивает HTML в data:text/html, а оттуда
// origin равен null: state.js не грузится ни относительным путём, ни абсолютным
// file://, ни через fetch. Поэтому состояние вписано ещё и внутрь страницы.
// Живое обновление остаётся за http (панель через preview_start, обычный браузер).
// Видимость НЕ проверяем: те же панели держат document.hidden === true всё время.
// rev растёт на каждой записи ap.py — и на синхронизации, которая не меняет
// updatedAt, но может закрыть этап или пересчитать манифест.
const stampOf = S => (S.rev || '') + '|' + (S.updatedAt || '') + '|' + (S.finishedAt || '') + '|' + (S.tickets || []).length;

function applyState(){
  const S = window.STATE;
  if (!S || typeof S !== 'object') return;
  // Перерисовываем только когда состояние действительно сдвинулось: молчаливая
  // перерисовка раз в десять секунд сбрасывала бы выделенный текст ни за что.
  const stamp = stampOf(S);
  if (stamp === lastStamp) return;
  lastStamp = stamp;
  const y = window.scrollY;
  // Упавший рендер не должен убивать страницу: сбрасываем штамп, чтобы следующий
  // круг опроса попробовал заново — иначе исправленный state.js уже не подберётся.
  try { render(CUR.lang); } catch (e) { lastStamp = ''; bootFail(String(e && e.message || e)); }
  window.scrollTo(0, y);
}

// Связь проверяется только там, где она вообще бывает: по http. Из data: файл не
// грузится никогда — там снимок и тишина; file:// читается с диска без сервера.
const SERVED = /^https?:$/.test(location.protocol);
function showLink(){
  const el = document.getElementById('link');
  if (!el) return;
  const lost = SERVED && misses >= 2 && !(window.STATE && window.STATE.finishedAt);
  el.hidden = !lost;
  el.parentNode.hidden = !lost;
  if (lost) el.textContent = CUR.lost;
}

// Одна подгрузка state.js; done(ok) — когда она закончилась.
function pullState(done){
  if (pulling) return;
  pulling = true;
  const s = document.createElement('script');
  // Метка времени в запросе — иначе file:// отдаст скрипт из кеша.
  s.src = 'state.js?t=' + Date.now();
  // Ошибка — обычное дело: файл могли поймать в момент записи. Две подряд —
  // уже не запись, а мёртвый сервер: тогда страница говорит об этом.
  const end = ok => {
    s.remove();
    pulling = false;
    misses = ok ? 0 : misses + 1;
    if (ok) applyState();
    showLink();
    if (done) done(ok);
  };
  s.onload = () => end(true);
  s.onerror = () => end(false);
  document.head.appendChild(s);
}

function pollState(){
  clearTimeout(pollT);
  if (window.STATE && window.STATE.finishedAt) return;
  pollT = setTimeout(() => pullState(pollState), POLL_MS);
}

// Стрелка сверху: подтянуть state.js сейчас, не дожидаясь круга опроса.
function refreshNow(btn){
  clearTimeout(pollT);
  if (btn) btn.classList.add('busy');
  const started = Date.now();
  pullState(ok => {
    if (!ok && btn) misses = Math.max(misses, 2);  // нажал и не получил — сказать сразу
    showLink();
    // Крутится хотя бы полсекунды: мгновенный ответ иначе не отличить от «не нажалось».
    setTimeout(() => {
      document.querySelectorAll('[data-refresh]').forEach(b => b.classList.remove('busy'));
    }, Math.max(0, 500 - (Date.now() - started)));
    pollState();
  });
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Статус таска → цвет полосы, значок, подписи. Ремонт — не «ещё немного
// разработки»: таск уже написан и вернулся с ревью, поэтому у него свой цвет.

  'repair':      {k:'fix',  bar:'f-fix', icon:'rotate', on:true},
  'failed':      {k:'bad',  bar:'f-bad', icon:'x', on:true},
  'pending':     {k:'wait', bar:'f-wait', icon:'hourglass'}
};
const kindOf = t => KIND[t.status] || KIND.pending;
const REQ_KIND = {'done':'done', 'in-ticket':'work', 'in-spec':'work', 'open':'open',
  'placeholder':'placeholder', 'deferred':'deferred', 'dropped':'dropped'};
const REQ_PILL = {done:'p-done', work:'p-mut', open:'p-mut', placeholder:'p-now', deferred:'p-mut', dropped:'p-mut'};
const REQ_RANK = {placeholder:0, deferred:1, dropped:2};

// Реестр тем: id → раскладка уже посчитанных в render() блоков (c = ctx).
// Функция только склеивает строки: STATE не читает и в DOM не пишет.

const VIEWS = {

  overview: c => `
